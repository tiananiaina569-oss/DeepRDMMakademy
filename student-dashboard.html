<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard — DeepRDMMakademy</title>

    <meta
        name="description"
        content="Espace étudiant DeepRDMMakademy — parcours pédagogique, progression, cours, exercices, évaluations et ressources."
    >

    <style>
        :root {
            --bg: #05080d;
            --bg-soft: #09111a;
            --panel: rgba(10, 20, 31, 0.88);
            --panel-strong: #0c1722;
            --border: rgba(48, 191, 221, 0.25);
            --border-gold: rgba(214, 174, 73, 0.38);

            --cyan: #27d7f5;
            --cyan-soft: #8beeff;
            --gold: #d6ae49;
            --gold-light: #f0d78a;

            --white: #f5fbff;
            --text: #d7e4eb;
            --muted: #8194a2;

            --success: #53d99b;
            --warning: #e7bd5a;
            --danger: #ef6d7d;

            --shadow:
                0 18px 50px rgba(0, 0, 0, 0.42);

            --radius: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 15% 5%,
                    rgba(24, 150, 190, 0.12),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 90% 20%,
                    rgba(214, 174, 73, 0.07),
                    transparent 25%
                ),
                linear-gradient(
                    145deg,
                    #03060a 0%,
                    #061019 50%,
                    #03060a 100%
                );

            color: var(--text);
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        button {
            font: inherit;
        }

        /* =========================
           BACKGROUND
        ========================== */

        .ambient {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .ambient::before,
        .ambient::after {
            content: "";
            position: absolute;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.12;
        }

        .ambient::before {
            top: 8%;
            left: -120px;
            background: var(--cyan);
        }

        .ambient::after {
            right: -120px;
            bottom: 10%;
            background: var(--gold);
        }

        /* =========================
           HEADER
        ========================== */

        header {
            position: sticky;
            top: 0;
            z-index: 100;

            background: rgba(4, 9, 14, 0.9);
            border-bottom: 1px solid rgba(39, 215, 245, 0.16);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .header-inner {
            min-height: 72px;
            max-width: 1400px;
            margin: auto;
            padding: 0 16px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            min-width: 0;
        }

        .logo {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;

            display: grid;
            place-items: center;

            border: 1px solid rgba(39, 215, 245, 0.55);
            border-radius: 50%;

            color: var(--cyan);
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 1px;

            background:
                radial-gradient(
                    circle,
                    rgba(39, 215, 245, 0.18),
                    rgba(0, 0, 0, 0.3)
                );

            box-shadow:
                0 0 25px rgba(39, 215, 245, 0.12),
                inset 0 0 20px rgba(39, 215, 245, 0.08);
        }

        .brand-text {
            min-width: 0;
        }

        .brand-name {
            color: var(--white);
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 0.2px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-label {
            margin-top: 2px;

            color: var(--cyan);
            font-family: monospace;
            font-size: 9px;
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-link {
            width: 40px;
            height: 40px;

            display: grid;
            place-items: center;

            border: 1px solid var(--border);
            border-radius: 12px;

            color: var(--text);
            background: rgba(8, 17, 26, 0.8);

            transition: 0.2s ease;
        }

        .header-link:hover {
            border-color: rgba(39, 215, 245, 0.6);
            color: var(--cyan);
            transform: translateY(-1px);
        }

        /* =========================
           MAIN
        ========================== */

        main {
            width: 100%;
            max-width: 1400px;
            margin: auto;
            padding: 22px 14px 50px;
        }

        .page-intro {
            margin-bottom: 20px;
        }

        .eyebrow {
            color: var(--cyan);
            font-family: monospace;
            font-size: 10px;
            letter-spacing: 2.2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h1 {
            color: var(--white);
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(28px, 8vw, 46px);
            line-height: 1.05;
            font-weight: 500;
        }

        .intro-text {
            max-width: 760px;
            margin-top: 10px;

            color: var(--muted);
            font-size: 14px;
            line-height: 1.65;
        }

        /* =========================
           SYNC BAR
        ========================== */

        .sync-bar {
            display: flex;
            align-items: center;
            gap: 10px;

            margin: 16px 0 20px;
            padding: 12px 14px;

            border: 1px solid rgba(39, 215, 245, 0.16);
            border-radius: 13px;

            background: rgba(8, 18, 28, 0.72);

            color: var(--muted);
            font-family: monospace;
            font-size: 10px;
            letter-spacing: 0.4px;
        }

        .sync-dot {
            width: 8px;
            height: 8px;
            flex: 0 0 8px;
            border-radius: 50%;
            background: var(--warning);
            box-shadow: 0 0 10px rgba(231, 189, 90, 0.4);
        }

        .sync-bar.connected .sync-dot {
            background: var(--success);
            box-shadow: 0 0 10px rgba(83, 217, 155, 0.5);
        }

        /* =========================
           PROFILE HERO
        ========================== */

        .hero-card {
            position: relative;
            overflow: hidden;

            padding: 20px;

            border: 1px solid var(--border);
            border-radius: var(--radius);

            background:
                linear-gradient(
                    145deg,
                    rgba(10, 27, 39, 0.94),
                    rgba(5, 13, 21, 0.94)
                );

            box-shadow: var(--shadow);
        }

        .hero-card::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            right: -70px;
            top: -70px;

            border-radius: 50%;
            border: 1px solid rgba(39, 215, 245, 0.1);
            box-shadow:
                0 0 0 20px rgba(39, 215, 245, 0.025),
                0 0 0 45px rgba(39, 215, 245, 0.015);
        }

        .hero-top {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .student-identity {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            width: 58px;
            height: 58px;
            flex: 0 0 58px;

            display: grid;
            place-items: center;

            border-radius: 16px;
            border: 1px solid rgba(39, 215, 245, 0.38);

            background:
                linear-gradient(
                    145deg,
                    rgba(39, 215, 245, 0.16),
                    rgba(214, 174, 73, 0.08)
                );

            color: var(--cyan-soft);
            font-size: 20px;
            font-weight: 800;
        }

        .student-name {
            color: var(--white);
            font-size: 20px;
            font-weight: 800;
        }

        .student-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            margin-top: 5px;

            color: var(--success);
            font-family: monospace;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .student-status::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 9px;
        }

        .level-box {
            min-height: 82px;
            padding: 12px;

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 13px;

            background: rgba(255, 255, 255, 0.025);
        }

        .level-label {
            color: var(--muted);
            font-family: monospace;
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .level-value {
            margin-top: 8px;
            color: var(--white);
            font-size: 16px;
            font-weight: 750;
        }

        .level-value.gold {
            color: var(--gold-light);
        }

        .level-value.cyan {
            color: var(--cyan-soft);
        }

        /* =========================
           PLACEMENT
        ========================== */

        .placement-card {
            margin-top: 14px;
            padding: 16px;

            border: 1px solid var(--border-gold);
            border-radius: var(--radius);

            background:
                linear-gradient(
                    145deg,
                    rgba(34, 27, 12, 0.42),
                    rgba(11, 18, 24, 0.78)
                );
        }

        .section-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;

            margin-bottom: 13px;
        }

        .section-title {
            color: var(--white);
            font-size: 15px;
            font-weight: 800;
        }

        .section-subtitle {
            margin-top: 3px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.45;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 25px;
            padding: 4px 8px;

            border-radius: 999px;

            border: 1px solid rgba(231, 189, 90, 0.35);
            background: rgba(231, 189, 90, 0.07);

            color: var(--gold-light);

            font-family: monospace;
            font-size: 8px;
            letter-spacing: 0.7px;
            text-transform: uppercase;

            white-space: nowrap;
        }

        .placement-score {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .score-ring {
            width: 72px;
            height: 72px;
            flex: 0 0 72px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            border:
                1px solid rgba(39, 215, 245, 0.4);

            background:
                radial-gradient(
                    circle,
                    rgba(39, 215, 245, 0.12),
                    rgba(0, 0, 0, 0.18)
                );

            color: var(--cyan-soft);
            font-size: 17px;
            font-weight: 800;
        }

        .placement-info {
            min-width: 0;
        }

        .placement-main {
            color: var(--white);
            font-size: 14px;
            font-weight: 750;
        }

        .placement-detail {
            margin-top: 5px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.5;
        }

        /* =========================
           QUICK ACTIONS
        ========================== */

        .section {
            margin-top: 24px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .action-card {
            min-height: 125px;
            padding: 15px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            border: 1px solid var(--border);
            border-radius: 15px;

            background:
                linear-gradient(
                    145deg,
                    rgba(10, 23, 34, 0.9),
                    rgba(5, 12, 18, 0.92)
                );

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .action-card:hover {
            transform: translateY(-2px);
            border-color: rgba(39, 215, 245, 0.55);

            background:
                linear-gradient(
                    145deg,
                    rgba(11, 31, 44, 0.95),
                    rgba(5, 13, 20, 0.95)
                );
        }

        .action-icon {
            width: 36px;
            height: 36px;

            display: grid;
            place-items: center;

            border: 1px solid rgba(39, 215, 245, 0.25);
            border-radius: 10px;

            color: var(--cyan);
            background: rgba(39, 215, 245, 0.06);

            font-size: 15px;
        }

        .action-name {
            margin-top: 14px;

            color: var(--white);
            font-size: 13px;
            font-weight: 750;
        }

        .action-description {
            margin-top: 4px;

            color: var(--muted);
            font-size: 10px;
            line-height: 1.4;
        }

        .action-arrow {
            align-self: flex-end;
            color: var(--cyan);
            font-size: 13px;
        }

        /* =========================
           PROGRESS
        ========================== */

        .progress-card {
            padding: 17px;

            border: 1px solid var(--border);
            border-radius: var(--radius);

            background: rgba(8, 18, 27, 0.82);
        }

        .progress-number {
            color: var(--white);
            font-size: 32px;
            font-weight: 850;
        }

        .progress-label {
            margin-top: 3px;
            color: var(--muted);
            font-size: 11px;
        }

        .progress-track {
            height: 8px;
            margin-top: 16px;

            overflow: hidden;

            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
        }

        .progress-fill {
            width: 0%;
            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    var(--cyan),
                    var(--gold)
                );

            box-shadow:
                0 0 16px rgba(39, 215, 245, 0.2);
        }

        .progress-meta {
            display: flex;
            justify-content: space-between;

            margin-top: 8px;

            color: var(--muted);
            font-family: monospace;
            font-size: 9px;
        }

        /* =========================
           SUBJECTS
        ========================== */

        .subject-list {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .subject-item {
            padding: 13px;

            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 13px;

            background: rgba(255, 255, 255, 0.025);
        }

        .subject-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;

            color: var(--white);
            font-size: 12px;
            font-weight: 700;
        }

        .subject-percent {
            color: var(--cyan);
            font-family: monospace;
            font-size: 10px;
        }

        .subject-track {
            height: 5px;
            margin-top: 9px;

            overflow: hidden;

            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
        }

        .subject-fill {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: var(--cyan);
        }

        /* =========================
           NEXT LESSON
        ========================== */

        .lesson-card {
            padding: 18px;

            border: 1px solid rgba(39, 215, 245, 0.28);
            border-radius: var(--radius);

            background:
                linear-gradient(
                    135deg,
                    rgba(11, 38, 51, 0.8),
                    rgba(7, 15, 23, 0.9)
                );
        }

        .lesson-status {
            color: var(--cyan);
            font-family: monospace;
            font-size: 9px;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .lesson-title {
            margin-top: 9px;

            color: var(--white);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 22px;
            font-weight: 500;
        }

        .lesson-description {
            margin-top: 8px;

            color: var(--muted);
            font-size: 12px;
            line-height: 1.55;
        }

        .primary-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            min-height: 45px;
            margin-top: 16px;
            padding: 0 18px;

            border: 1px solid rgba(39, 215, 245, 0.55);
            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    rgba(39, 215, 245, 0.16),
                    rgba(39, 215, 245, 0.05)
                );

            color: var(--cyan-soft);

            font-size: 12px;
            font-weight: 800;

            transition: 0.2s ease;
        }

        .primary-button:hover {
            transform: translateY(-1px);
            border-color: var(--cyan);
            background: rgba(39, 215, 245, 0.13);
        }

        /* =========================
           TIMET
