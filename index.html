<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DeepRDMMakademy — L'art de la science et de la technologie</title>

    <meta
        name="description"
        content="DeepRDMMakademy — plateforme scientifique, technologique et éducative."
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050814;
            color: #ffffff;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }

        /* =========================
           BACKGROUND
        ========================= */

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(55, 90, 255, 0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 30%,
                    rgba(145, 55, 255, 0.15),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 50% 90%,
                    rgba(0, 210, 255, 0.08),
                    transparent 35%
                ),
                #050814;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.25;
            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );
            background-size: 50px 50px;
            pointer-events: none;
        }

        /* =========================
           NAVIGATION
        ========================= */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 18px 6%;
            background: rgba(5, 8, 20, 0.78);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        nav {
            max-width: 1250px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .logo-mark {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            border: 1px solid rgba(110, 210, 255, 0.7);
            background:
                radial-gradient(
                    circle,
                    rgba(0, 220, 255, 0.28),
                    rgba(80, 40, 255, 0.15)
                );
            box-shadow:
                0 0 20px rgba(0, 190, 255, 0.25);
            color: #ffffff;
            font-size: 13px;
        }

        .logo-text span {
            display: block;
        }

        .logo-subtitle {
            font-size: 9px;
            color: #8ba0bd;
            letter-spacing: 2px;
            margin-top: 3px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
            color: #b8c5d9;
            font-size: 14px;
        }

        .nav-links a {
            transition: 0.25s;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .nav-button {
            padding: 11px 17px;
            border-radius: 30px;
            border: 1px solid rgba(92, 205, 255, 0.55);
            background: rgba(30, 150, 255, 0.1);
            color: #ffffff;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 100vh;
            padding: 150px 6% 90px;
            display: flex;
            align-items: center;
        }

        .hero-container {
            max-width: 1250px;
            width: 100%;
            margin: auto;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 70px;
            align-items: center;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 8px 14px;
            border: 1px solid rgba(100, 210, 255, 0.22);
            border-radius: 30px;
            color: #91dfff;
            background: rgba(50, 150, 255, 0.07);
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #54e6ff;
            box-shadow: 0 0 12px #54e6ff;
        }

        .hero h1 {
            font-size: clamp(42px, 7vw, 82px);
            line-height: 0.98;
            letter-spacing: -3px;
            margin-bottom: 24px;
        }

        .hero h1 .gradient {
            background: linear-gradient(
                90deg,
                #ffffff,
                #79dcff,
                #9c7cff
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero h2 {
            font-size: clamp(19px, 2.5vw, 28px);
            color: #d3dceb;
            font-weight: 400;
            margin-bottom: 22px;
        }

        .hero p {
            max-width: 680px;
            color: #8e9db5;
            font-size: 17px;
            line-height: 1.8;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 35px;
        }

        .primary-btn,
        .secondary-btn {
            padding: 15px 23px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.25s;
        }

        .primary-btn {
            border: 1px solid #62d9ff;
            background: linear-gradient(
                135deg,
                #1266d8,
                #6738d8
            );
            color: white;
            box-shadow: 0 12px 35px rgba(44, 111, 255, 0.2);
        }

        .secondary-btn {
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(255,255,255,0.04);
            color: #d9e2f0;
        }

        .primary-btn:hover,
        .secondary-btn:hover {
            transform: translateY(-2px);
        }

        /* =========================
           SCIENCE VISUAL
        ========================= */

        .hero-visual {
            min-height: 470px;
            position: relative;
            display: grid;
            place-items: center;
        }

        .orb {
            width: min(390px, 75vw);
            aspect-ratio: 1;
            border-radius: 50%;
            position: relative;
            background:
                radial-gradient(
                    circle at center,
                    rgba(82, 215, 255, 0.18),
                    rgba(71, 59, 180, 0.1) 45%,
                    transparent 65%
                );
            border: 1px solid rgba(102, 210, 255, 0.32);
            box-shadow:
                0 0 70px rgba(0, 180, 255, 0.12),
                inset 0 0 60px rgba(100, 80, 255, 0.08);
            animation: float 6s ease-in-out infinite;
        }

        .orb::before,
        .orb::after {
            content: "";
            position: absolute;
            inset: 12%;
            border-radius: 50%;
            border: 1px solid rgba(91, 205, 255, 0.25);
            transform: rotate(35deg) scaleX(1.35);
        }

        .orb::after {
            transform: rotate(-35deg) scaleX(1.35);
        }

        .orb-core {
            position: absolute;
            width: 95px;
            height: 95px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: grid;
            place-items: center;
            border: 1px solid rgba(255,255,255,0.45);
            background:
                radial-gradient(
                    circle,
                    rgba(0, 224, 255, 0.5),
                    rgba(100, 50, 255, 0.2)
                );
            box-shadow:
                0 0 35px rgba(0, 220, 255, 0.3);
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .node {
            position: absolute;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #9deaff;
            box-shadow: 0 0 18px #45d9ff;
        }

        .node:nth-child(1) {
            top: 12%;
            left: 45%;
        }

        .node:nth-child(2) {
            top: 34%;
            right: 7%;
        }

        .node:nth-child(3) {
            bottom: 16%;
            right: 20%;
        }

        .node:nth-child(4) {
            bottom: 22%;
            left: 12%;
        }

        .node:nth-child(5) {
            top: 35%;
            left: 7%;
        }

        .visual-label {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            padding: 9px 15px;
            border-radius: 20px;
            background: rgba(7, 13, 30, 0.75);
            border: 1px solid rgba(255,255,255,0.1);
            color: #9eb0c9;
            font-size: 11px;
            letter-spacing: 1px;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        /* =========================
           SECTION
        ========================= */

        section {
            padding: 100px 6%;
        }

        .section-container {
            max-width: 1250px;
            margin: auto;
        }

        .section-header {
            max-width: 750px;
            margin-bottom: 50px;
        }

        .section-tag {
            color: #68dfff;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 11px;
            margin-bottom: 13px;
        }

        .section-header h2 {
            font-size: clamp(32px, 5vw, 52px);
            margin-bottom: 17px;
        }

        .section-header p {
            color: #8494ad;
            line-height: 1.8;
            font-size: 16px;
        }

        /* =========================
           LAB CARDS
        ========================= */

        .labs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .lab-card {
            min-height: 235px;
            padding: 27px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.09);
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.055),
                    rgba(255,255,255,0.018)
                );
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .lab-card::before {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            right: -70px;
            top: -70px;
            background: rgba(55, 175, 255, 0.08);
            filter: blur(15px);
        }

        .lab-card:hover {
            transform: translateY(-6px);
            border-color: rgba(95, 213, 255, 0.35);
        }

        .lab-number {
            color: #5fdcff;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 22px;
        }

        .lab-card h3 {
            font-size: 22px;
            margin-bottom: 13px;
        }

        .lab-card p {
            color: #7f8fa7;
            line-height: 1.65;
            font-size: 14px;
        }

        .lab-link {
            display: inline-block;
            margin-top: 20px;
            color: #9ce9ff;
            font-size: 13px;
        }

        /* =========================
           AKADEMY
        ========================= */

        .academy {
            border-top: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            background: rgba(255,255,255,0.015);
        }

        .academy-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: stretch;
        }

        .academy-panel {
            padding: 35px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            background: rgba(5, 10, 25, 0.7);
        }

        .academy-panel h3 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .academy-panel p {
            color: #8595ad;
            line-height: 1.8;
        }

        .academy-list {
            list-style: none;
            margin-top: 25px;
        }

        .academy-list li {
            padding: 13px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            color: #c5d0df;
        }

        .academy-list li::before {
            content: "✓";
            color: #64ddff;
            margin-right: 10px;
        }

        /* =========================
           RESEARCH
        ========================= */

        .research-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .research-card {
            padding: 30px;
            border-radius: 18px;
            background: rgba(255,255,255,0.035);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .research-card h3 {
            margin-bottom: 12px;
            font-size: 21px;
        }

        .research-card p {
            color: #8494ab;
            line-height: 1.7;
            font-size: 14px;
        }

        /* =========================
           COMMUNITY / CTA
        ========================= */

        .cta {
            text-align: center;
        }

        .cta-box {
            max-width: 950px;
            margin: auto;
            padding: 65px 30px;
            border-radius: 25px;
            border: 1px solid rgba(105, 211, 255, 0.18);
            background:
                radial-gradient(
                    circle at center,
                    rgba(40, 100, 255, 0.12),
                    transparent 60%
                ),
                rgba(255,255,255,0.025);
        }

        .cta-box h2 {
            font-size: clamp(32px, 5vw, 52px);
            margin-bottom: 15px;
        }

        .cta-box p {
            color: #8c9bb1;
            max-width: 650px;
            margin: auto;
            line-height: 1.8;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            padding: 50px 6% 30px;
            border-top: 1px solid rgba(255,255,255,0.07);
        }

        .footer-inner {
            max-width: 1250px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            gap: 30px;
            flex-wrap: wrap;
        }

        .footer-brand {
            max-width: 350px;
        }

        .footer-brand p {
            color: #718198;
            line-height: 1.7;
            margin-top: 12px;
            font-size: 13px;
        }

        .footer-links {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            color: #8290a6;
            font-size: 13px;
        }

        .footer-bottom {
            max-width: 1250px;
            margin: 35px auto 0;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
            color: #56647a;
            font-size: 11px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {

            .nav-links {
                display: none;
            }

            .hero-container,
            .academy-grid {
                grid-template-columns: 1fr;
            }

            .hero {
                padding-top: 125px;
            }

            .hero-visual {
                min-height: 390px;
            }

            .labs-grid,
            .research-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 600px) {

            header {
                padding: 14px 5%;
            }

            .logo-mark {
                width: 37px;
                height: 37px;
            }

            .hero {
                padding: 120px 5% 70px;
            }

            section {
                padding: 75px 5%;
            }

            .hero h1 {
                letter-spacing: -2px;
            }

            .hero p {
                font-size: 15px;
            }

            .labs-grid,
            .research-grid {
                grid-template-columns: 1fr;
            }

            .lab-card {
                min-height: auto;
            }

            .academy-panel {
                padding: 25px;
            }

            .hero-actions {
                flex-direction: column;
            }

            .primary-btn,
            .secondary-btn {
                width: 100%;
            }

            .hero-visual {
                min-height: 330px;
            }

            .orb {
                width: 300px;
            }
        }
    </style>
</head>

<body>

                    <h1>
