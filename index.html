<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap');

:root {
    --bg: #000011;
    --cyan: #00F0FF;
    --cyan2: #66F8FF;
    --pink: #FF00F0;
    --white: #F4FFFF;
    --panel: rgba(2, 25, 45, 0.72);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Orbitron', sans-serif;
}

html,
body {
    background: #000011;
    color: white;
    overflow-x: hidden;
}

/* =========================================================
   PARTICULES
   ========================================================= */

#particles-js {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -20;
    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(0, 240, 255, 0.10),
            transparent 35%
        ),
        #000011;
}

/* =========================================================
   HEADER
   ========================================================= */

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 18px 5%;

    background: rgba(0, 5, 15, 0.72);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    border-bottom: 1px solid rgba(0, 240, 255, 0.7);

    box-shadow:
        0 0 15px rgba(0, 240, 255, 0.15);

    z-index: 100;
}

.logo {
    font-size: 24px;

    color: var(--cyan);

    text-shadow:
        0 0 5px var(--cyan),
        0 0 12px var(--cyan),
        0 0 25px rgba(0,240,255,.7);
}

.nav-btns button {
    background: transparent;

    border: 1px solid var(--pink);

    color: var(--pink);

    padding: 8px 15px;

    margin-left: 10px;

    cursor: pointer;

    transition: .3s;
}

.nav-btns button:hover {
    background: var(--pink);

    color: #000011;

    box-shadow:
        0 0 10px var(--pink),
        0 0 30px var(--pink);
}

.followers {
    color: var(--cyan);

    margin-right: 20px;

    text-shadow:
        0 0 8px var(--cyan);
}

/* =========================================================
   HERO PRINCIPAL
   ========================================================= */

.hero {

    position: relative;

    min-height: 820px;
    height: 100vh;

    padding:
        150px
        5%
        80px;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    overflow: hidden;

    isolation: isolate;
}

/* =========================================================
   GRAND HALO CENTRAL
   ========================================================= */

.hero .hero-core-light {
    position: absolute;

    width: 700px;
    height: 700px;

    left: 50%;
    top: 48%;

    transform: translate(-50%, -50%);

    background:
        radial-gradient(
            circle,
            rgba(255,0,240,.18) 0%,
            rgba(0,240,255,.14) 28%,
            rgba(0,240,255,.07) 48%,
            transparent 72%
        );

    filter: blur(10px);

    z-index: -10;

    animation: corePulse 5s ease-in-out infinite;
}

@keyframes corePulse {

    0%,100% {
        transform: translate(-50%, -50%) scale(.95);
        opacity: .7;
    }

    50% {
        transform: translate(-50%, -50%) scale(1.12);
        opacity: 1;
    }
}

/* =========================================================
   GRILLE 3D — BEAUCOUP PLUS VISIBLE
   ========================================================= */

.hero .hero-grid {
    position: absolute;

    left: -50%;
    bottom: -28%;

    width: 200%;
    height: 80%;

    background-image:
        linear-gradient(
            rgba(0,240,255,.30) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,240,255,.30) 1px,
            transparent 1px
        );

    background-size: 50px 50px;

    transform:
        perspective(500px)
        rotateX(65deg);

    transform-origin: center bottom;

    opacity: .9;

    mask-image:
        linear-gradient(
            to top,
            black 5%,
            black 35%,
            transparent 100%
        );

    -webkit-mask-image:
        linear-gradient(
            to top,
            black 5%,
            black 35%,
            transparent 100%
        );

    z-index: -7;

    animation: gridMove 9s linear infinite;
}

@keyframes gridMove {

    from {
        background-position:
            0 0,
            0 0;
    }

    to {
        background-position:
            0 50px,
            50px 0;
    }
}

/* =========================================================
   CERCLES HOLOGRAPHIQUES
   ========================================================= */

.hero .holo-ring {
    position: absolute;

    left: 50%;
    top: 52%;

    width: 500px;
    height: 500px;

    border-radius: 50%;

    border:
        1px solid rgba(0,240,255,.55);

    box-shadow:
        0 0 15px rgba(0,240,255,.3),
        inset 0 0 20px rgba(0,240,255,.15);

    transform:
        translate(-50%, -50%)
        rotateX(70deg);

    z-index: -5;

    animation:
        ringRotate 15s linear infinite;
}

.hero .holo-ring::before,
.hero .holo-ring::after {

    content: "";

    position: absolute;

    inset: 35px;

    border-radius: 50%;

    border:
        1px dashed rgba(255,0,240,.65);

    box-shadow:
        0 0 15px rgba(255,0,240,.25);
}

.hero .holo-ring::after {
    inset: 90px;

    border:
        1px solid rgba(0,240,255,.55);
}

@keyframes ringRotate {

    from {
        transform:
            translate(-50%, -50%)
            rotateX(70deg)
            rotateZ(0deg);
    }

    to {
        transform:
            translate(-50%, -50%)
            rotateX(70deg)
            rotateZ(360deg);
    }
}

/* =========================================================
   LIGNES DE SCAN
   ========================================================= */

.hero .scan-line {
    position: absolute;

    left: 0;

    width: 100%;

    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--cyan),
            white,
            var(--pink),
            var(--cyan),
            transparent
        );

    box-shadow:
        0 0 8px var(--cyan),
        0 0 20px var(--pink);

    opacity: .8;

    z-index: 3;

    animation: screenScan 5s linear infinite;

    pointer-events: none;
}

@keyframes screenScan {

    0% {
        top: 5%;
        opacity: 0;
    }

    8% {
        opacity: .9;
    }

    90% {
        opacity: .9;
    }

    100% {
        top: 95%;
        opacity: 0;
    }
}

/* =========================================================
   LIGNES CIRCUITS
   ========================================================= */

.hero .circuit {
    position: absolute;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--cyan),
            transparent
        );

    box-shadow:
        0 0 8px var(--cyan);

    opacity: .8;

    z-index: -2;
}

.hero .circuit::after {

    content: "";

    position: absolute;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--cyan);

    box-shadow:
        0 0 8px var(--cyan),
        0 0 18px var(--cyan);

    top: -3px;
}

.circuit-one {
    width: 28%;
    left: 0;
    top: 28%;

    transform: rotate(12deg);
}

.circuit-one::after {
    right: 20%;
}

.circuit-two {
    width: 25%;
    right: 0;
    top: 34%;

    transform: rotate(-15deg);
}

.circuit-two::after {
    left: 20%;
}

.circuit-three {
    width: 35%;
    left: 2%;
    bottom: 25%;

    transform: rotate(-8deg);
}

.circuit-three::after {
    right: 30%;
}

.circuit-four {
    width: 32%;
    right: 3%;
    bottom: 29%;

    transform: rotate(9deg);
}

.circuit-four::after {
    left: 25%;
}

/* =========================================================
   TITRE
   ========================================================= */

.hero h1 {

    position: relative;

    z-index: 10;

    font-size:
        clamp(32px, 5.5vw, 78px);

    line-height: 1.05;

    font-weight: 900;

    letter-spacing: 3px;

    color: #ffffff;

    text-shadow:
        0 0 4px white,
        0 0 10px var(--pink),
        0 0 25px var(--pink),
        0 0 45px var(--pink),
        0 0 80px rgba(255,0,240,.65);

    animation:
        titleGlow 2.2s ease-in-out infinite,
        titleFlicker 8s infinite;

    transform: translateZ(60px);
}

@keyframes titleGlow {

    0%,100% {

        text-shadow:
            0 0 4px white,
            0 0 10px var(--pink),
            0 0 25px var(--pink),
            0 0 45px var(--pink);
    }

    50% {

        text-shadow:
            0 0 8px white,
            0 0 18px var(--pink),
            0 0 40px var(--pink),
            0 0 75px var(--pink);
    }
}

@keyframes titleFlicker {

    0%,92%,100% {
        opacity: 1;
        transform: translateZ(60px);
    }

    93% {
        opacity: .75;
        transform:
            translateZ(60px)
            translateX(-2px);
    }

    94% {
        opacity: 1;
        transform:
            translateZ(60px)
            translateX(2px);
    }

    95% {
        opacity: .85;
        transform:
            translateZ(60px)
            translateX(-1px);
    }
}

/* =========================================================
   SCAN DU TITRE
   ========================================================= */

.hero h1::after {

    content: "";

    position: absolute;

    left: -5%;
    top: 0;

    width: 110%;
    height: 3px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--cyan),
            white,
            var(--pink),
            transparent
        );

    box-shadow:
        0 0 8px var(--cyan),
        0 0 18px var(--pink);

    animation: titleScan 3.8s linear infinite;

    pointer-events: none;
}

@keyframes titleScan {

    0% {
        top: 0;
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    90% {
        opacity: 1;
    }

    100% {
        top: 100%;
        opacity: 0;
    }
}

/* =========================================================
   SOUS-TITRE
   ========================================================= */

.hero > p {

    position: relative;

    z-index: 10;

    max-width: 900px;

    margin:
        25px auto
        45px;

    color: #d5e6ef;

    font-size:
        clamp(12px, 1.5vw, 18px);

    line-height: 1.7;

    text-shadow:
        0 0 8px rgba(0,240,255,.45);

    transform: translateZ(35px);
}

/* =========================================================
   PANNEAUX HOLOGRAPHIQUES
   ========================================================= */

.hero-holo-panels {

    position: absolute;

    top: 48%;

    left: 0;

    width: 100%;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 3%;

    transform: translateY(-50%);

    z-index: 5;

    pointer-events: none;
}

.hero-panel {

    position: relative;

    width: 245px;
    min-height: 135px;

    padding: 20px;

    background:
        linear-gradient(
            135deg,
            rgba(0,240,255,.16),
            rgba(0,15,30,.82)
        );

    border:
        1px solid var(--cyan);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    box-shadow:
        0 0 8px var(--cyan),
        0 0 25px rgba(0,240,255,.35),
        inset 0 0 25px rgba(0,240,255,.12);

    text-align: left;

    transform:
        perspective(700px)
        rotateY(13deg);

    animation: panelLeft 4s ease-in-out infinite;
}

.hero-panel:last-child {

    text-align: right;

    transform:
        perspective(700px)
        rotateY(-13deg);

    animation:
        panelRight 4s ease-in-out infinite;
}

@keyframes panelLeft {

    0%,100% {
        transform:
            perspective(700px)
            rotateY(13deg)
            translateY(0);
    }

    50% {
        transform:
            perspective(700px)
            rotateY(13deg)
            translateY(-10px);
    }
}

@keyframes panelRight {

    0%,100% {
        transform:
            perspective(700px)
            rotateY(-13deg)
            translateY(0);
    }

    50% {
        transform:
            perspective(700px)
            rotateY(-13deg)
            translateY(-10px);
    }
}

/* Coins lumineux */

.hero-panel::before,
.hero-panel::after {

    content: "";

    position: absolute;

    width: 25px;
    height: 25px;

    border-color: var(--cyan);

    border-style: solid;

    box-shadow:
        0 0 10px var(--cyan);
}

.hero-panel::before {

    top: -1px;
    left: -1px;

    border-width: 2px 0 0 2px;
}

.hero-panel::after {

    bottom: -1px;
    right: -1px;

    border-width: 0 2px 2px 0;
}

.panel-label {

    color: var(--cyan);

    font-size: 11px;

    letter-spacing: 2px;

    margin-bottom: 15px;

    text-shadow:
        0 0 8px var(--cyan);
}

.panel-value {

    color: #ffffff;

    font-size: 14px;

    font-weight: 700;

    line-height: 1.6;

    text-shadow:
        0 0 8px rgba(255,255,255,.55);
}

.panel-dot {

    display: inline-block;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    margin-right: 7px;

    background: #00ff66;

    box-shadow:
        0 0 8px #00ff66,
        0 0 20px #00ff66;

    animation: onlinePulse 1.3s infinite;
}

@keyframes onlinePulse {

    50% {
        opacity: .35;
    }
}

/* =========================================================
   LÉGER BRUIT HOLOGRAPHIQUE
   ========================================================= */

.hero .hero-noise {

    position: absolute;

    inset: 0;

    z-index: 20;

    pointer-events: none;

    opacity: .055;

    background-image:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.5) 0,
            rgba(255,255,255,.5) 1px,
            transparent 1px,
            transparent 4px
        );

    animation: noiseShift .3s steps(2) infinite;
}

@keyframes noiseShift {

    0% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(2px);
    }

    100% {
        transform: translateY(-1px);
    }
}

/* =========================================================
   MODULES EXISTANTS
   ========================================================= */

.grid-lab {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(320px, 1fr));

    gap: 30px;

    padding: 50px 5%;

    position: relative;

    z-index: 30;
}

.module {

    background: var(--panel);

    border:
        1px solid var(--cyan);

    border-radius: 15px;

    padding: 30px;

    box-shadow:
        0 0 25px rgba(0,240,255,.18);

    transition: .4s;

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}

.module:hover {

    transform:
        translateY(-15px)
        rotateX(5deg);

    box-shadow:
        0 0 50px var(--cyan);
}

.module h3 {

    color: var(--cyan);

    font-size: 22px;

    margin-bottom: 15px;

    text-shadow:
        0 0 8px var(--cyan);
}

.module p {

    color: #d5d5d5;

    margin-bottom: 20px;

    min-height: 60px;
}

.btn-module {

    background: transparent;

    border:
        1px solid var(--pink);

    color: var(--pink);

    padding: 12px;

    width: 100%;

    cursor: pointer;

    font-weight: bold;

    transition: .3s;
}

.btn-module:hover {

    background: var(--pink);

    color: var(--bg);

    box-shadow:
        0 0 15px var(--pink),
        0 0 35px var(--pink);
}

/* =========================================================
   NOTIFICATION
   ========================================================= */

.notif {

    position: fixed;

    top: 90px;
    right: 20px;

    background: var(--pink);

    color: var(--bg);

    padding: 15px;

    border-radius: 8px;

    display: none;

    z-index: 999;

    box-shadow:
        0 0 20px var(--pink);
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 900px) {

    .hero {

        min-height: 760px;

        height: auto;

        padding:
            150px
            20px
            90px;
    }

    .hero-core-light {

        width: 500px !important;
        height: 500px !important;
    }

    .hero-holo-panels {

        position: relative;

        top: auto;
        left: auto;

        transform: none;

        width: 100%;

        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 10px;

        padding: 0;

        margin-top: 15px;
    }

    .hero-panel,
    .hero-panel:last-child {

        width: 100%;

        min-height: 100px;

        transform: none;

        animation: mobileFloat 4s infinite;

        text-align: center;
    }

    .hero-panel:last-child {

        animation-delay: -2s;
    }

    @keyframes mobileFloat {

        0%,100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-6px);
        }
    }

    .holo-ring {

        width: 400px !important;
        height: 400px !important;
    }

    .grid-lab {

        grid-template-columns: 1fr;

        padding:
            30px
            15px;
    }
}

@media (max-width: 600px) {

    header {

        padding:
            13px
            10px;
    }

    .logo {

        font-size: 12px;
    }

    .followers {

        display: none;
    }

    .nav-btns button {

        font-size: 8px;

        padding:
            6px
            7px;

        margin-left: 3px;
    }

    .hero {

        min-height: 730px;

        padding:
            125px
            10px
            70px;
    }

    .hero h1 {

        font-size:
            clamp(27px, 9vw, 42px);

        letter-spacing:
            1px;
    }

    .hero > p {

        font-size: 10px;

        line-height: 1.7;

        margin:
            18px auto
            30px;
    }

    .hero-holo-panels {

        grid-template-columns: 1fr;

        gap: 8px;
    }

    .hero-panel,
    .hero-panel:last-child {

        min-height: 75px;

        padding:
            10px;

        text-align: center;
    }

    .panel-label {

        font-size: 8px;

        margin-bottom: 7px;
    }

    .panel-value {

        font-size: 9px;
    }

    .panel-dot {

        width: 6px;
        height: 6px;
    }

    .hero .hero-grid {

        background-size:
            35px 35px;

        opacity: .8;
    }

    .holo-ring {

        width: 300px !important;
        height: 300px !important;
    }

    .circuit-one,
    .circuit-two {

        opacity: .4;
    }
}
</style>
