<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap');

    :root {
        --bg: #000011;
        --neon-cyan: #00F0FF;
        --neon-pink: #FF00F0;
        --panel: rgba(0, 15, 30, 0.70);
        --white-blue: #dffcff;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Orbitron', sans-serif;
    }

    html {
        background: var(--bg);
        scroll-behavior: smooth;
    }

    body {
        background: var(--bg);
        color: white;
        overflow-x: hidden;
    }

    /* =========================================================
       FOND GLOBAL — RÉSEAU DE PARTICULES
       ========================================================= */

    #particles-js {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -10;
        pointer-events: none;
        background: #000011;
    }

    /* =========================================================
       HEADER — CONSERVÉ
       ========================================================= */

    header {
        position: fixed;
        top: 0;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 5%;
        background: rgba(0, 0, 0, 0.50);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--neon-cyan);
        z-index: 100;
    }

    .logo {
        font-size: 24px;
        color: var(--neon-cyan);
        text-shadow:
            0 0 5px var(--neon-cyan),
            0 0 15px var(--neon-cyan);
    }

    .nav-btns button {
        background: transparent;
        border: 1px solid var(--neon-pink);
        color: var(--neon-pink);
        padding: 8px 15px;
        margin-left: 10px;
        cursor: pointer;
        transition: 0.3s;
    }

    .nav-btns button:hover {
        background: var(--neon-pink);
        color: var(--bg);
        box-shadow: 0 0 20px var(--neon-pink);
    }

    .followers {
        color: var(--neon-cyan);
        margin-right: 20px;
    }

    /* =========================================================
       HERO — LABORATOIRE HOLOGRAPHIQUE
       ========================================================= */

    .hero {
        position: relative;
        min-height: 760px;
        height: 100vh;
        padding: 180px 5% 100px;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        text-align: center;
        overflow: hidden;

        isolation: isolate;

        /* Profondeur générale */
        perspective: 1200px;
    }

    /* =========================================================
       GRILLE 3D DU LABORATOIRE
       ========================================================= */

    .hero::before {
        content: "";
        position: absolute;
        left: -50%;
        bottom: -25%;
        width: 200%;
        height: 75%;

        background-image:
            linear-gradient(
                rgba(0, 240, 255, 0.13) 1px,
                transparent 1px
            ),
            linear-gradient(
                90deg,
                rgba(0, 240, 255, 0.13) 1px,
                transparent 1px
            );

        background-size: 55px 55px;

        transform:
            perspective(600px)
            rotateX(65deg);

        transform-origin: center bottom;

        opacity: 0.65;

        mask-image: linear-gradient(
            to top,
            black 0%,
            rgba(0,0,0,0.8) 45%,
            transparent 100%
        );

        -webkit-mask-image: linear-gradient(
            to top,
            black 0%,
            rgba(0,0,0,0.8) 45%,
            transparent 100%
        );

        animation: heroGridMove 14s linear infinite;

        pointer-events: none;
        z-index: -4;
    }

    @keyframes heroGridMove {
        from {
            background-position: 0 0, 0 0;
        }

        to {
            background-position: 0 55px, 55px 0;
        }
    }

    /* =========================================================
       ATMOSPHÈRE HOLOGRAPHIQUE
       ========================================================= */

    .hero::after {
        content: "";
        position: absolute;
        inset: 0;

        background:
            radial-gradient(
                circle at 50% 42%,
                rgba(255, 0, 240, 0.13),
                transparent 22%
            ),
            radial-gradient(
                circle at 50% 70%,
                rgba(0, 240, 255, 0.13),
                transparent 35%
            ),
            repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 5px,
                rgba(0, 240, 255, 0.025) 6px
            );

        pointer-events: none;
        z-index: -3;

        animation: hologramAtmosphere 7s ease-in-out infinite;
    }

    @keyframes hologramAtmosphere {
        0%, 100% {
            opacity: 0.65;
        }

        50% {
            opacity: 1;
        }
    }

    /* =========================================================
       LIGNES DE SCAN DU LABORATOIRE
       ========================================================= */

    .hero-scanline {
        position: absolute;
        left: 0;
        width: 100%;
        height: 1px;

        background:
            linear-gradient(
                90deg,
                transparent,
                var(--neon-cyan),
                white,
                var(--neon-pink),
                transparent
            );

        box-shadow:
            0 0 8px var(--neon-cyan),
            0 0 20px var(--neon-pink);

        opacity: 0.65;

        animation: scanScreen 6s linear infinite;

        pointer-events: none;
        z-index: 2;
    }

    @keyframes scanScreen {
        0% {
            top: -5%;
            opacity: 0;
        }

        10% {
            opacity: 0.7;
        }

        90% {
            opacity: 0.7;
        }

        100% {
            top: 105%;
            opacity: 0;
        }
    }

    /* =========================================================
       PETITS CIRCUITS NÉON
       ========================================================= */

    .hero-circuit {
        position: absolute;
        width: 180px;
        height: 180px;

        border: 1px solid rgba(0, 240, 255, 0.25);

        opacity: 0.65;

        pointer-events: none;
        z-index: -1;
    }

    .hero-circuit::before,
    .hero-circuit::after {
        content: "";
        position: absolute;
        background: var(--neon-cyan);
        box-shadow: 0 0 10px var(--neon-cyan);
    }

    .hero-circuit::before {
        width: 100%;
        height: 1px;
        top: 50%;
        left: 0;
    }

    .hero-circuit::after {
        width: 1px;
        height: 100%;
        top: 0;
        left: 50%;
    }

    .hero-circuit-left {
        left: -70px;
        top: 28%;
        transform: rotate(25deg);
    }

    .hero-circuit-right {
        right: -70px;
        bottom: 18%;
        transform: rotate(-25deg);
    }

    /* =========================================================
       TITRE PRINCIPAL
       ========================================================= */

    .hero h1 {
        position: relative;

        font-size: clamp(34px, 5vw, 76px);
        line-height: 1.05;
        font-weight: 900;
        letter-spacing: 3px;

        color: #ffffff;

        text-shadow:
            0 0 5px #ffffff,
            0 0 12px var(--neon-pink),
            0 0 25px var(--neon-pink),
            0 0 55px rgba(255, 0, 240, 0.8);

        animation:
            heroTitleGlow 2.5s ease-in-out infinite,
            hologramShake 7s infinite;

        z-index: 5;

        /* Légère profondeur */
        transform: translateZ(60px);
    }

    /* Ligne de scan qui traverse le titre */

    .hero h1::after {
        content: "";

        position: absolute;
        left: -5%;
        width: 110%;
        height: 3px;

        top: 0;

        background:
            linear-gradient(
                90deg,
                transparent,
                var(--neon-cyan),
                white,
                var(--neon-pink),
                transparent
            );

        box-shadow:
            0 0 8px var(--neon-cyan),
            0 0 18px var(--neon-pink);

        opacity: 0;

        animation: titleScan 4s linear infinite;

        pointer-events: none;
    }

    @keyframes titleScan {
        0% {
            top: 0%;
            opacity: 0;
        }

        8% {
            opacity: 1;
        }

        92% {
            opacity: 1;
        }

        100% {
            top: 100%;
            opacity: 0;
        }
    }

    @keyframes heroTitleGlow {
        0%, 100% {
            text-shadow:
                0 0 5px #fff,
                0 0 12px var(--neon-pink),
                0 0 25px var(--neon-pink),
                0 0 50px rgba(255, 0, 240, 0.7);
        }

        50% {
            text-shadow:
                0 0 8px #fff,
                0 0 20px var(--neon-pink),
                0 0 45px var(--neon-pink),
                0 0 80px rgba(255, 0, 240, 0.9);
        }
    }

    @keyframes hologramShake {
        0%, 90%, 100% {
            transform: translateZ(60px) translateX(0);
        }

        91% {
            transform: translateZ(60px) translateX(-1px);
        }

        92% {
            transform: translateZ(60px) translateX(2px);
        }

        93% {
            transform: translateZ(60px) translateX(-2px);
        }

        94% {
            transform: translateZ(60px) translateX(1px);
        }
    }

    /* =========================================================
       SOUS-TITRE — CONSERVÉ
       ========================================================= */

    .hero > p {
        position: relative;

        max-width: 850px;
        margin: 25px auto 40px;

        color: #a9b5c7;

        font-size: clamp(13px, 1.4vw, 18px);
        line-height: 1.7;

        text-shadow:
            0 0 8px rgba(0, 240, 255, 0.25);

        z-index: 5;

        transform: translateZ(35px);
    }

    /* =========================================================
       PANNEAUX HOLOGRAPHIQUES
       ========================================================= */

    .hero-holo-panels {
        position: absolute;
        top: 50%;
        left: 0;

        width: 100%;

        display: flex;
        justify-content: space-between;
        align-items: center;

        padding: 0 3%;

        transform: translateY(-50%);

        pointer-events: none;

        z-index: 1;
    }

    .hero-panel {
        position: relative;

        width: min(230px, 20vw);
        min-height: 125px;

        padding: 20px;

        display: flex;
        flex-direction: column;
        justify-content: center;

        text-align: left;

        background:
            linear-gradient(
                135deg,
                rgba(0, 240, 255, 0.10),
                rgba(0, 15, 30, 0.65)
            );

        border: 1px solid rgba(0, 240, 255, 0.8);

        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);

        box-shadow:
            0 0 8px rgba(0, 240, 255, 0.7),
            0 0 25px rgba(0, 240, 255, 0.25),
            inset 0 0 20px rgba(0, 240, 255, 0.08);

        transform:
            perspective(700px)
            rotateY(12deg);

        animation: panelFloat 5s ease-in-out infinite;
    }

    .hero-panel:last-child {
        transform:
            perspective(700px)
            rotateY(-12deg);

        animation-delay: -2.5s;
    }

    @keyframes panelFloat {
        0%, 100% {
            transform:
                perspective(700px)
                rotateY(12deg)
                translateY(0);
        }

        50% {
            transform:
                perspective(700px)
                rotateY(12deg)
                translateY(-8px);
        }
    }

    .hero-panel:last-child {
        animation-name: panelFloatRight;
    }

    @keyframes panelFloatRight {
        0%, 100% {
            transform:
                perspective(700px)
                rotateY(-12deg)
                translateY(0);
        }

        50% {
            transform:
                perspective(700px)
                rotateY(-12deg)
                translateY(-8px);
        }
    }

    /* Ligne lumineuse supérieure */

    .hero-panel::before {
        content: "";

        position: absolute;
        top: -1px;
        left: 12%;
        width: 76%;
        height: 2px;

        background: var(--neon-cyan);

        box-shadow:
            0 0 8px var(--neon-cyan),
            0 0 18px var(--neon-cyan);

        animation: panelScan 3s linear infinite;
    }

    @keyframes panelScan {
        0% {
            left: 5%;
            width: 20%;
        }

        50% {
            left: 40%;
            width: 20%;
        }

        100% {
            left: 75%;
            width: 20%;
        }
    }

    .hero-panel .panel-label {
        color: var(--neon-cyan);

        font-size: 11px;
        letter-spacing: 2px;

        margin-bottom: 12px;

        text-shadow:
            0 0 8px var(--neon-cyan);
    }

    .hero-panel .panel-value {
        color: #ffffff;

        font-size: 14px;
        font-weight: 700;

        letter-spacing: 1px;

        text-shadow:
            0 0 8px rgba(255,255,255,0.6);
    }

    .hero-panel .panel-dot {
        display: inline-block;

        width: 8px;
        height: 8px;

        margin-right: 8px;

        border-radius: 50%;

        background: #00ff66;

        box-shadow:
            0 0 8px #00ff66,
            0 0 18px #00ff66;

        animation: statusBlink 1.5s infinite;
    }

    @keyframes statusBlink {
        50% {
            opacity: 0.35;
        }
    }

    /* =========================================================
       BRUIT / GRAIN HOLOGRAPHIQUE
       ========================================================= */

    .hero-noise {
        position: absolute;
        inset: 0;

        pointer-events: none;

        opacity: 0.08;

        z-index: 4;

        background-image:
            repeating-radial-gradient(
                circle at 0 0,
                rgba(255,255,255,0.8) 0,
                rgba(255,255,255,0.8) 1px,
                transparent 1px,
                transparent 3px
            );

        background-size: 4px 4px;

        animation: noiseMove 0.25s steps(2) infinite;
    }

    @keyframes noiseMove {
        0% {
            transform: translate(0, 0);
        }

        25% {
            transform: translate(-2px, 1px);
        }

        50% {
            transform: translate(1px, -2px);
        }

        75% {
            transform: translate(2px, 2px);
        }

        100% {
            transform: translate(0, 0);
        }
    }

    /* =========================================================
       MODULES LABO — CONSERVÉS
       ========================================================= */

    .grid-lab {
        position: relative;
        z-index: 10;

        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));

        gap: 30px;

        padding: 50px 5%;
    }

    .module {
        background: var(--panel);

        border: 1px solid var(--neon-cyan);

        border-radius: 15px;

        padding: 30px;

        box-shadow:
            0 0 25px rgba(0,240,255,0.15);

        transition: 0.4s;

        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
    }

    .module:hover {
        transform:
            translateY(-15px)
            rotateX(5deg);

        box-shadow:
            0 0 50px var(--neon-cyan);
    }

    .module h3 {
        color: var(--neon-cyan);

        font-size: 22px;

        margin-bottom: 15px;
    }

    .module p {
        color: #ccc;

        margin-bottom: 20px;

        min-height: 60px;
    }

    .btn-module {
        background: transparent;

        border: 1px solid var(--neon-pink);

        color: var(--neon-pink);

        padding: 12px;

        width: 100%;

        cursor: pointer;

        font-weight: bold;

        transition: 0.3s;
    }

    .btn-module:hover {
        background: var(--neon-pink);

        color: var(--bg);

        box-shadow:
            0 0 20px var(--neon-pink);
    }

    /* =========================================================
       NOTIFICATION — CONSERVÉE
       ========================================================= */

    .notif {
        position: fixed;

        top: 90px;
        right: 20px;

        background: var(--neon-pink);

        color: var(--bg);

        padding: 15px;

        border-radius: 8px;

        display: none;

        z-index: 999;
    }

    /* =========================================================
       RESPONSIVE — TÉLÉPHONE
       ========================================================= */

    @media (max-width: 900px) {

        .hero {
            min-height: 700px;
            height: auto;

            padding:
                150px
                20px
                100px;
        }

        .hero h1 {
            font-size: clamp(30px, 8vw, 52px);

            letter-spacing: 1px;
        }

        .hero > p {
            font-size: 12px;

            max-width: 600px;

            margin-bottom: 30px;
        }

        .hero-holo-panels {
            position: relative;

            top: auto;
            left: auto;

            transform: none;

            width: 100%;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

            padding: 0;

            margin-top: 20px;
        }

        .hero-panel,
        .hero-panel:last-child {
            width: 100%;

            min-height: 95px;

            padding: 13px;

            transform: none;

            animation: mobilePanelFloat 5s ease-in-out infinite;
        }

        .hero-panel:last-child {
            animation-delay: -2.5s;
        }

        @keyframes mobilePanelFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }
        }

        .hero-panel .panel-label {
            font-size: 8px;

            letter-spacing: 1px;

            margin-bottom: 8px;
        }

        .hero-panel .panel-value {
            font-size: 10px;

            letter-spacing: 0;
        }

        .hero-panel .panel-dot {
            width: 6px;
            height: 6px;
            margin-right: 5px;
        }

        .hero-circuit {
            opacity: 0.35;
        }

        .grid-lab {
            grid-template-columns: 1fr;

            padding:
                30px
                15px;
        }
    }

    @media (max-width: 600px) {

        header {
            padding:
                14px
                12px;
        }

        .logo {
            font-size: 13px;
        }

        .followers {
