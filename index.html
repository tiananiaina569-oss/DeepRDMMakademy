<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DeepRDMMakademy — Campus Numérique</title>

<meta name="description"
      content="DeepRDMMakademy — Campus numérique scientifique, laboratoires, recherche, simulations, missions et communauté.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 0%, rgba(0,212,255,.16), transparent 35%),
        radial-gradient(circle at 90% 30%, rgba(255,0,240,.08), transparent 30%),
        #020817;
    color: #f4fbff;
    font-family: "Inter", Arial, sans-serif;
    overflow-x: hidden;
}

button,
input,
select,
textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
}

a {
    color: inherit;
    text-decoration: none;
}

/* =========================================================
   VARIABLES
========================================================= */

:root {
    --cyan: #00eaff;
    --cyan2: #00bfff;
    --pink: #ff25ef;
    --blue: #147dff;
    --green: #20ff9a;

    --bg: #020817;
    --panel: rgba(4, 20, 42, .86);
    --panel2: rgba(7, 29, 58, .92);

    --border: rgba(0, 224, 255, .38);

    --shadow:
        0 0 20px rgba(0, 220, 255, .15),
        inset 0 0 30px rgba(0, 180, 255, .04);

    --radius: 22px;
}

/* =========================================================
   BACKGROUND
========================================================= */

.background-grid {
    position: fixed;
    inset: 0;
    z-index: -5;
    pointer-events: none;

    background-image:
        linear-gradient(rgba(0, 225, 255, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 225, 255, .045) 1px, transparent 1px);

    background-size: 55px 55px;

    transform:
        perspective(700px)
        rotateX(58deg)
        scale(1.5)
        translateY(28%);

    transform-origin: center bottom;

    opacity: .7;
}

.background-glow {
    position: fixed;
    inset: 0;
    z-index: -4;
    pointer-events: none;

    background:
        radial-gradient(circle at 20% 20%, rgba(0, 220, 255, .15), transparent 25%),
        radial-gradient(circle at 80% 35%, rgba(255, 0, 240, .10), transparent 25%),
        radial-gradient(circle at 50% 80%, rgba(0, 130, 255, .13), transparent 35%);
}

.scanline {
    position: fixed;
    left: 0;
    right: 0;
    height: 2px;
    top: -10px;
    z-index: 999;
    pointer-events: none;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(0,234,255,.55),
        transparent
    );

    box-shadow: 0 0 15px var(--cyan);

    animation: scan 8s linear infinite;
    opacity: .25;
}

@keyframes scan {
    0% {
        top: -10px;
    }

    100% {
        top: 110vh;
    }
}

/* =========================================================
   HEADER
========================================================= */

header {
    position: sticky;
    top: 0;
    z-index: 100;

    width: 100%;

    background:
        linear-gradient(
            180deg,
            rgba(2, 12, 29, .96),
            rgba(2, 12, 29, .84)
        );

    border-bottom: 1px solid rgba(0, 220, 255, .25);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 8px 35px rgba(0,0,0,.35),
        0 0 30px rgba(0,200,255,.05);
}

.header-inner {
    max-width: 1400px;
    margin: auto;

    min-height: 76px;

    display: flex;
    align-items: center;
    gap: 18px;

    padding: 10px 22px;
}

/* LOGO */

.logo {
    display: flex;
    align-items: center;
    gap: 12px;

    min-width: 230px;
}

.logo-circle {
    width: 48px;
    height: 48px;

    border: 2px solid var(--cyan);
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: var(--cyan);

    font-family: Orbitron, sans-serif;
    font-weight: 800;
    font-size: 13px;

    box-shadow:
        0 0 12px rgba(0,234,255,.7),
        inset 0 0 15px rgba(0,234,255,.15);

    text-shadow: 0 0 8px var(--cyan);
}

.logo-title {
    font-family: Orbitron, sans-serif;
    font-weight: 700;
    font-size: 15px;
}

.logo-subtitle {
    color: #a6bdd4;
    font-size: 10px;
    margin-top: 3px;
}

/* NAV */

.main-nav {
    flex: 1;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 22px;
}

.main-nav a {
    color: #c9deef;
    font-family: Orbitron, sans-serif;
    font-size: 10px;
    letter-spacing: .5px;

    transition: .25s ease;
}

.main-nav a:hover {
    color: var(--cyan);
    text-shadow: 0 0 10px var(--cyan);
}

/* HEADER ACTIONS */

.header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.icon-button {
    width: 39px;
    height: 39px;

    border-radius: 50%;
    border: 1px solid rgba(0,220,255,.45);

    background: rgba(0,100,160,.15);

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 17px;
}

.follow-button {
    border: 1px solid var(--cyan);
    color: var(--cyan);

    background: rgba(0,220,255,.07);

    padding: 10px 15px;
    border-radius: 25px;

    font-weight: 700;
}

.join-button {
    border: 0;

    background:
        linear-gradient(
            135deg,
            #00f0ff,
            #00b9ff
        );

    color: #00131d;

    padding: 12px 20px;
    border-radius: 25px;

    font-weight: 800;

    box-shadow:
        0 0 18px rgba(0,234,255,.4);
}

.menu-button {
    display: none;
}

/* =========================================================
   MAIN
========================================================= */

main {
    width: 100%;
    max-width: 1400px;
    margin: auto;

    padding: 18px 22px 100px;
}

/* =========================================================
   HERO
========================================================= */

.hero {
    position: relative;

    min-height: 480px;

    border: 1px solid rgba(0,220,255,.32);
    border-radius: 30px;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 75% 35%,
            rgba(0,220,255,.25),
            transparent 28%
        ),
        radial-gradient(
            circle at 20% 30%,
            rgba(255,0,240,.10),
            transparent 25%
        ),
        linear-gradient(
            135deg,
            rgba(4,24,49,.96),
            rgba(2,11,27,.92)
        );

    box-shadow:
        0 0 50px rgba(0,210,255,.12),
        inset 0 0 50px rgba(0,190,255,.05);
}

.hero::before {
    content: "";

    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(rgba(0,234,255,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,234,255,.045) 1px, transparent 1px);

    background-size: 45px 45px;

    transform:
        perspective(600px)
        rotateX(55deg)
        scale(1.7)
        translateY(28%);

    opacity: .6;
}

.hero-content {
    position: relative;
    z-index: 2;

    width: 58%;

    padding: 60px 40px;
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    padding: 7px 13px;

    border: 1px solid rgba(0,234,255,.4);
    border-radius: 20px;

    color: var(--cyan);

    background: rgba(0,234,255,.08);

    font-size: 11px;
    font-weight: 700;

    box-shadow: 0 0 18px rgba(0,234,255,.1);
}

.status-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: var(--green);

    box-shadow: 0 0 12px var(--green);
}

.hero h1 {
    margin-top: 25px;

    font-family: Orbitron, sans-serif;

    font-size: clamp(34px, 5vw, 70px);
    line-height: 1.05;

    color: white;

    text-shadow:
        0 0 12px rgba(255,255,255,.35);
}

.hero h1 span {
    display: block;

    color: var(--cyan);

    text-shadow:
        0 0 10px var(--cyan),
        0 0 30px rgba(0,234,255,.5);
}

.hero-description {
    max-width: 650px;

    margin-top: 20px;

    color: #d6e8f5;

    font-size: 16px;
    line-height: 1.7;
}

.hero-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;

    margin-top: 28px;
}

.primary-button {
    border: 0;

    padding: 14px 23px;

    border-radius: 30px;

    background:
        linear-gradient(
            135deg,
            #00edff,
            #00a9ff
        );

    color: #00121b;

    font-weight: 800;

    box-shadow:
        0 0 22px rgba(0,234,255,.35);
}

.secondary-button {
    border: 1px solid var(--cyan);

    padding: 13px 22px;

    border-radius: 30px;

    background: rgba(0,234,255,.06);

    color: var(--cyan);

    font-weight: 700;
}

.secondary-button:hover,
.primary-button:hover,
.join-button:hover,
.follow-button:hover {
    transform: translateY(-2px);
    filter: brightness(1.12);
}

/* HERO VISUAL */

.hero-visual {
    position: absolute;
    right: 0;
    top: 0;

    width: 47%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;
}

.holo-core {
    width: 260px;
    height: 260px;

    border: 1px solid rgba(0,234,255,.6);
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    box-shadow:
        0 0 35px rgba(0,234,255,.25),
        inset 0 0 45px rgba(0,234,255,.08);

    animation: pulseCore 4s ease-in-out infinite;
}

.holo-core::before,
.holo-core::after {
    content: "";

    position: absolute;

    border: 1px solid rgba(0,234,255,.35);
    border-radius: 50%;
}

.holo-core::before {
    inset: -35px;
}

.holo-core::after {
    inset: 35px;
}

.core-icon {
    font-size: 70px;

    filter:
        drop-shadow(0 0 15px var(--cyan));

    animation: float 3s ease-in-out infinite;
}

@keyframes pulseCore {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.05);
    }
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }
}

/* =========================================================
   QUICK STATS
========================================================= */

.quick-stats {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 10px;

    margin-top: 14px;
}

.stat-card {
    min-height: 75px;

    display: flex;
    align-items: center;
    gap: 15px;

    padding: 14px 18px;

    border-radius: 18px;

    border: 1px solid rgba(0,220,255,.27);

    background:
        linear-gradient(
            135deg,
            rgba(8,33,65,.95),
            rgba(3,17,36,.95)
        );

    box-shadow: var(--shadow);
}

.stat-icon {
    width: 45px;
    height: 45px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: var(--cyan);

    border: 1px solid rgba(0,234,255,.4);

    background: rgba(0,234,255,.06);

    font-size: 22px;
}

.stat-title {
    font-weight: 700;
    color: #f5fbff;
}

.stat-text {
    font-size: 11px;
    color: #9db9cf;
    margin-top: 4px;
}

/* =========================================================
   SECTION
========================================================= */

.section {
    margin-top: 28px;
}

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;

    margin-bottom: 14px;
}

.section-title {
    font-family: Orbitron, sans-serif;

    font-size: clamp(18px, 2vw, 25px);

    color: #f7fcff;

    text-shadow:
        0 0 12px rgba(0,234,255,.25);
}

.section-title span {
    color: var(--cyan);
}

.section-link {
    color: var(--cyan);

    font-size: 12px;
    font-weight: 700;

    border-bottom: 1px solid rgba(0,234,255,.3);

    padding-bottom: 3px;
}

/* =========================================================
   QUICK ACCESS
========================================================= */

.quick-access {
    display: grid;

    grid-template-columns: repeat(6, 1fr);

    gap: 10px;
}

.access-card {
    min-height: 130px;

    padding: 20px 10px;

    border: 1px solid rgba(0,220,255,.25);
    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(7,31,60,.95),
            rgba(3,15,32,.95)
        );

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    transition: .25s ease;
}

.access-card:hover {
    transform: translateY(-4px);

    border-color: var(--cyan);

    box-shadow:
        0 0 25px rgba(0,234,255,.12);
}

.access-icon {
    font-size: 32px;
    margin-bottom: 12px;

    filter:
        drop-shadow(0 0 8px var(--cyan));
}

.access-card strong {
    color: #f3fbff;
    font-size: 13px;
}

.access-card small {
    color: #9bb7cc;
    font-size: 10px;
    margin-top: 5px;
}

/* =========================================================
   SIMULATION
========================================================= */

.simulation-panel {
    position: relative;

    min-height: 300px;

    overflow: hidden;

    border: 1px solid rgba(0,234,255,.35);

    border-radius: 25px;

    background:
        radial-gradient(
            circle at 80% 50%,
            rgba(0,234,255,.16),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            rgba(6,31,60,.96),
            rgba(2,14,31,.97)
        );

    box-shadow:
        0 0 40px rgba(0,180,255,.08),
        inset 0 0 35px rgba(0,234,255,.04);
}

.simulation-content {
    position: relative;
    z-index: 2;

    width: 55%;

    padding: 38px;
}

.simulation-badge {
    display: inline-block;

    border: 1px solid rgba(0,234,255,.45);

    padding: 7px 12px;

    border-radius: 20px;

    color: var(--cyan);

    font-family: Orbitron, sans-serif;
    font-size: 10px;
}

.simulation-panel h2 {
    font-family: Orbitron, sans-serif;

    font-size: clamp(25px, 4vw, 42px);

    margin-top: 18px;

    color: #f8fdff;
}

.simulation-panel p {
    color: #c4dbea;

    margin-top: 12px;

    line-height: 1.6;

    max-width: 600px;
}

.simulation-visual {
    position: absolute;

    right: 5%;
    top: 50%;

    transform: translateY(-50%);

    width: 270px;
    height: 270px;

    border: 1px solid rgba(0,234,255,.55);

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow:
        0 0 45px rgba(0,234,255,.18),
        inset 0 0 50px rgba(0,234,255,.08);

    animation: rotateSlow 18s linear infinite;
}

.simulation-visual span {
    font-size: 65px;

    animation: rotateReverse 18s linear infinite;
}

@keyframes rotateSlow {
    from {
        transform: translateY(-50%) rotate(0);
    }

    to {
        transform: translateY(-50%) rotate(360deg);
    }
}

@keyframes rotateReverse {
    from {
        transform: rotate(0);
    }

    to {
        transform: rotate(-360deg);
    }
}

.simulation-topics {
    position: absolute;

    bottom: 15px;
    left: 30px;
    right: 30px;

    display: flex;
    flex-wrap: wrap;

    gap: 8px;
}

.topic {
    padding: 7px 11px;

    border: 1px solid rgba(0,234,255,.28);

    border-radius: 15px;

    background: rgba(0,234,255,.05);

    color: #bfe8f5;

    font-size: 10px;
}

/* =========================================================
   PUBLICATIONS
========================================================= */

.publications-box {
    border: 1px solid rgba(0,
