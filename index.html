<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DeepRDMMakademy | Science & Technologie</title>

    <meta
        name="description"
        content="DeepRDMMakademy — L'art de la science et de la technologie."
    >

    <style>

        /* =====================================================
           DEEPRDMMAKADEMY
           MOBILE-FIRST INSTITUTIONAL INTERFACE
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #03070d;
            --bg2: #07101c;
            --panel: #091421;
            --panel2: #0c1826;
            --line: rgba(45, 190, 255, 0.18);
            --line-soft: rgba(255, 255, 255, 0.07);

            --cyan: #19d9ff;
            --blue: #3c82ff;
            --gold: #d5ad50;
            --white: #edf5ff;
            --muted: #8191a7;
            --muted2: #56677d;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(30, 90, 180, 0.12),
                    transparent 32%
                ),
                var(--bg);

            color: var(--white);

            font-family:
                "Courier New",
                Courier,
                monospace;

            min-height: 100vh;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            font-family: inherit;
        }

        /* =====================================================
           BACKGROUND GRID
        ===================================================== */

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(80, 180, 255, 0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(80, 180, 255, 0.025) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            pointer-events: none;
            z-index: -2;
        }

        body::after {
            content: "";

            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    transparent 0%,
                    rgba(0,0,0,0.25) 65%,
                    rgba(0,0,0,0.65) 100%
                );

            pointer-events: none;
            z-index: -1;
        }

        /* =====================================================
           TOP NAVIGATION
        ===================================================== */

        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

            z-index: 1000;

            height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 18px;

            background:
                rgba(3, 7, 13, 0.90);

            border-bottom:
                1px solid var(--line);

            backdrop-filter: blur(16px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .brand-symbol {
            width: 39px;
            height: 39px;

            border: 1px solid var(--cyan);
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--cyan);

            font-weight: bold;
            font-size: 12px;

            box-shadow:
                0 0 20px rgba(25, 217, 255, 0.16);
        }

        .brand-name {
            font-family: Georgia, serif;
            font-size: 14px;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .brand-sub {
            color: var(--gold);
            font-size: 7px;
            letter-spacing: 1.5px;
            margin-top: 4px;
            white-space: nowrap;
        }

        .menu-button {
            width: 43px;
            height: 43px;

            display: flex;
            align-items: center;
            justify-content: center;

            border:
                1px solid rgba(255,255,255,0.14);

            border-radius: 50%;

            background: rgba(255,255,255,0.025);

            color: var(--white);

            font-size: 22px;
        }

        /* =====================================================
           HERO
        ===================================================== */

        .hero {
            min-height: 100vh;

            padding:
                125px
                20px
                70px;

            display: flex;
            align-items: center;
        }

        .hero-inner {
            width: 100%;
            max-width: 1250px;
            margin: auto;
        }

        .system-line {
            display: flex;
            align-items: center;
            justify-content: space-between;

            color: var(--muted);

            font-size: 9px;
            letter-spacing: 2px;

            margin-bottom: 28px;
        }

        .system-status {
            color: #20e99b;
        }

        .system-status::before {
            content: "●";
            margin-right: 7px;
        }

        .hero-label {
            color: var(--gold);

            font-size: 10px;
            letter-spacing: 3px;

            margin-bottom: 20px;
        }

        .hero h1 {
            font-family: Georgia, serif;

            font-size: clamp(44px, 14vw, 90px);

            line-height: 0.95;

            font-weight: normal;

            letter-spacing: -2px;

            margin-bottom: 25px;
        }

        .hero h1 span {
            color: var(--cyan);
        }

        .hero-slogan {
            color: var(--gold);

            font-family: Georgia, serif;

            font-size: 18px;

            line-height: 1.5;

            margin-bottom: 22px;
        }

        .hero-description {
            color: var(--muted);

            font-size: 13px;

            line-height: 1.9;

            max-width: 620px;
        }

        .hero-actions {
            display: grid;
            grid-template-columns: 1fr;

            gap: 11px;

            margin-top: 35px;
        }

        .action {
            min-height: 54px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 18px;

            border:
                1px solid var(--line);

            background:
                linear-gradient(
                    90deg,
                    rgba(20, 130, 200, 0.10),
                    rgba(255,255,255,0.02)
                );

            color: var(--white);

            font-size: 11px;
            letter-spacing: 1.2px;

            transition: 0.25s;
        }

        .action:hover {
            border-color: var(--cyan);
            background: rgba(25, 217, 255, 0.08);
        }

        .action .arrow {
            color: var(--cyan);
            font-size: 18px;
        }

        .action.gold {
            border-color: rgba(213,173,80,0.35);
        }

        .action.gold .arrow {
            color: var(--gold);
        }

        /* =====================================================
           SCIENCE ORBIT
        ===================================================== */

        .orbit-section {
            padding: 30px 20px 100px;
        }

        .orbit {
            width: min(300px, 75vw);
            aspect-ratio: 1;

            margin: auto;

            border:
                1px solid rgba(70,180,255,0.35);

            border-radius: 50%;

            position: relative;

            box-shadow:
                0 0 60px rgba(30,140,255,0.08);
        }

        .orbit::before,
        .orbit::after {
            content: "";

            position: absolute;

            inset: 12% -7%;

            border:
                1px solid rgba(70,180,255,0.25);

            border-radius: 50%;

            transform: rotate(30deg);
        }

        .orbit::after {
            transform: rotate(-30deg);
        }

        .orbit-core {
            position: absolute;

            width: 74px;
            height: 74px;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            border:
                1px solid var(--cyan);

            background:
                radial-gradient(
                    circle,
                    rgba(25,217,255,0.30),
                    rgba(30,60,120,0.18)
                );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 13px;
            font-weight: bold;

            box-shadow:
                0 0 35px rgba(25,217,255,0.22);
        }

        .particle {
            position: absolute;

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--cyan);

            box-shadow:
                0 0 12px var(--cyan);
        }

        .particle.p1 {
            top: 9%;
            left: 45%;
        }

        .particle.p2 {
            right: 5%;
            top: 43%;
        }

        .particle.p3 {
            bottom: 10%;
            left: 32%;
        }

        .particle.p4 {
            left: 4%;
            top: 48%;
        }

        /* =====================================================
           SECTION SYSTEM
        ===================================================== */

        .section {
            padding: 80px 20px;
        }

        .section-inner {
            max-width: 1250px;
            margin: auto;
        }

        .section-header {
            margin-bottom: 35px;
        }

        .section-number {
            color: var(--gold);

            font-size: 10px;
            letter-spacing: 3px;

            margin-bottom: 13px;
        }

        .section-number::after {
            content: "";

            display: inline-block;

            width: 45px;
            height: 1px;

            background: var(--gold);

            vertical-align: middle;

            margin-left: 10px;
        }

        .section-title {
            font-family: Georgia, serif;

            font-size: 38px;

            font-weight: normal;

            line-height: 1.05;
        }

        .section-title span {
            color: var(--gold);
        }

        .section-description {
            color: var(--muted);

            font-size: 12px;

            line-height: 1.8;

            margin-top: 15px;
        }

        /* =====================================================
           LABORATORY
        ===================================================== */

        .lab-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;
        }

        .lab-card {
            min-height: 175px;

            padding: 20px 16px;

            border:
                1px solid var(--line);

            background:
                rgba(8,19,32,0.75);

            position: relative;

            transition: 0.25s;
        }

        .lab-card:hover {
            transform: translateY(-3px);

            border-color:
                rgba(25,217,255,0.55);
        }

        .lab-id {
            color: var(--muted2);

            font-size: 8px;

            letter-spacing: 2px;

            margin-bottom: 25px;
        }

        .lab-icon {
            font-size: 24px;

            margin-bottom: 16px;
        }

        .lab-card h3 {
            font-family: Georgia, serif;

            font-size: 18px;

            font-weight: normal;

            margin-bottom: 8px;
        }

        .lab-card p {
            color: var(--muted);

            font-size: 9px;

            line-height: 1.6;
        }

        .lab-arrow {
            position: absolute;

            right: 15px;
            bottom: 14px;

            color: var(--cyan);

            font-size: 15px;
        }

        /* =====================================================
           AKADEMY
        ===================================================== */

        .academy-panel {
            border:
                1px solid rgba(213,173,80,0.25);

            background:
                linear-gradient(
                    145deg,
                    rgba(213,173,80,0.06),
                    rgba(255,255,255,0.015)
                );

            padding: 25px;
        }

        .academy-top {
            display: flex;

            justify-content: space-between;
            align-items: flex-start;

            margin-bottom: 30px;
        }

        .academy-code {
            color: var(--gold);

            font-size: 9px;

            letter-spacing: 2px;
        }

        .academy-status {
            color: #20e99b;

            font-size: 8px;

            letter-spacing: 1px;
        }

        .academy-title {
            font-family: Georgia, serif;

            font-size: 30px;

            font-weight: normal;

            margin-bottom: 14px;
        }

        .academy-text {
            color: var(--muted);

            font-size: 11px;

            line-height: 1.8;

            margin-bottom: 25px;
        }

        .academy-steps {
            display: grid;

            gap: 1px;
        }

        .academy-step {
            padding: 13px;

            background: rgba(255,255,255,0.025);

            border-left:
                2px solid rgba(25,217,255,0.35);

            color: #9eafc4;

            font-size: 9px;
        }

        .academy-step strong {
            color: var(--white);

            margin-right: 8px;
        }

        /* =====================================================
           RESEARCH
        ===================================================== */

        .research-list {
            display: grid;
            gap: 10px;
        }

        .research-item {
            display: flex;

            align-items: center;

            gap: 18px;

            padding: 20px;

            border:
                1px solid var(--line-soft);

            background:
                rgba(255,255,255,0.018);
        }

        .research-number {
            color: var(--cyan);

            font-size: 12px;
        }

        .research-item h3 {
            font-family: Georgia, serif;

            font-weight: normal;

            font-size: 16px;

            margin-bottom: 6px;
        }

        .research-item p {
            color: var(--muted);

            font-size: 9px;

            line-height: 1.6;
        }

        /* =====================================================
           JOURNAL
        ===================================================== */

        .journal-card {
            padding: 28px 20px;

            border:
                1px solid rgba(25,217,255,0.22);

            background:
                rgba(5,15,27,0.8);
        }

        .journal-label {
            color: var(--cyan);

            font-size: 9px;

            letter-spacing: 3px;

            margin-bottom: 20px;
        }

        .journal-card h2 {
            font-family: Georgia, serif;

            font-size: 30px;

            font-weight: normal;

            margin-bottom: 15px;
        }

        .journal-card p {
            color: var(--muted);

            font-size: 11px;

            line-height: 1.8;

            margin-bottom: 25px;
        }

        /* =====================================================
           COMMUNITY
        ===================================================== */

        .community {
            text-align: center;

            padding-top: 90px;
            padding-bottom: 90px;
        }

        .community .section-number {
            display: block;
        }

        .community-title {
            font-family: Georgia, serif;

            font-size: 35px;

            font-weight: normal;

            margin-bottom: 18px;
        }

        .community-text {
            color: var(--muted);

            font-size: 11px;

            line-height: 1.8;

            max-width: 600px;

            margin: auto auto 30px;
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        footer {
            border-top:
                1px solid var(--line);

            padding:
                45px 20px
                30px;

            background:
                rgba(0,0,0,0.3);
        }

        .footer-inner {
            max-width: 1250px;
            margin: auto;
        }

        .footer-brand {
            margin-bottom: 30px;
        }

        .footer-brand h2 {
            font-family: Georgia, serif;

            font-weight: normal;

            font-size: 21px;

            margin-bottom: 10px;
        }

        .footer-brand p {
            color: var(--muted);

            font-size: 9px;

            line-height: 1.7;
        }

        .footer-links {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }

        .footer-links a {
            color: #74859b;

            font-size: 9px;

            padding: 8px 0;
        }

        .footer-links a:hover {
            color: var(--cyan);
        }

        .copyright {
            margin-top: 35px;

            padding-top: 18px;

            border-top:
                1px solid var(--line-soft);

            color: #46566a;

            font-size: 8px;

            letter-spacing: 1px;
        }

        /* =====================================================
           TABLET
        ===================================================== */

        @media (min-width: 700px) {

            .topbar {
                padding: 0 35px;
            }

            .hero {
                padding-left: 50px;
                padding-right: 50px;
            }

            .hero-actions {
                grid-template-columns:
                    repeat(2, minmax(200px, 300px));
            }

            .section {
                padding-left: 50px;
                padding-right: 50px;
            }

            .lab-grid {
                grid-template-columns:
                    repeat(3, 1fr);
            }

            .footer-links {
                grid-template-columns:
                    repeat(3, 1fr);
            }
        }

        /* =====================================================
           DESKTOP
        ===================================================== */

        @media (min-width: 1000px) {

            .topbar {
                height: 82px;

                padding:
                    0 6%;
            }

            .menu-button {
                display: none;
            }

            .hero {
                min-height: 900px;

                padding:
                    150px 6% 100px;
            }

            .hero-inner {
                display: grid;

                grid-template-columns:
                    1.1fr 0.9fr;

                gap: 80px;

                align-items: center;
            }

            .orbit-section {
                display: none;
            }

            .section {
                padding:
                    110px 6%;
            }

            .lab-grid {
                grid-template-columns:
                    repeat(3, 1fr);
            }
