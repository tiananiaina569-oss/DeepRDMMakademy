<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap');

:root {
    --bg: #000011;
    --neon-cyan: #00F0FF;
    --neon-pink: #FF00F0;
    --cyan-soft: rgba(0, 240, 255, 0.35);
    --pink-soft: rgba(255, 0, 240, 0.35);
    --panel: rgba(0, 15, 30, 0.72);
}

/* =========================================================
   BASE
   ========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Orbitron', sans-serif;
}

html {
    background: var(--bg);
}

body {
    background: var(--bg);
    color: white;
    overflow-x: hidden;
}

/* =========================================================
   PARTICULES — TON SYSTÈME EXISTANT EST CONSERVÉ
   ========================================================= */

#particles-js {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;

    background: #000011;

    z-index: -50;

    pointer-events: none;
}

/* =========================================================
   HEADER — CONSERVÉ
   ========================================================= */

header {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 20px 5%;

    background: rgba(0, 0, 0, 0.58);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    border-bottom: 1px solid var(--neon-cyan);

    box-shadow:
        0 0 15px rgba(0, 240, 255, 0.15);

    z-index: 100;
}

.logo {
    font-size: 24px;

    color: var(--neon-cyan);

    text-shadow:
        0 0 8px var(--neon-cyan),
        0 0 18px var(--neon-cyan);
}

.nav-btns button {
    background: transparent;

    border: 1px solid var(--neon-pink);

    color: var(--neon-pink);

    padding: 8px 15px;

    margin-left: 10px;

    cursor: pointer;

    transition: 0.3s;
}

.nav-btns button:hover {
    background: var(--neon-pink);

    color: var(--bg);

    box-shadow:
        0 0 10px var(--neon-pink),
        0 0 25px var(--neon-pink);
}

.followers {
    color: var(--neon-cyan);

    margin-right: 20px;

    text-shadow:
        0 0 8px var(--neon-cyan);
}

/* =========================================================
   HERO — ZONE DU LABORATOIRE
   ========================================================= */

.hero {

    position: relative;

    width: 100%;
    min-height: 820px;
    height: 100vh;

    padding: 170px 5% 100px;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    overflow: hidden;

    isolation: isolate;

    perspective: 1400px;
}

/* =========================================================
   ATMOSPHÈRE LUMINEUSE CENTRALE
   ========================================================= */

.hero::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 46%;

    width: 900px;
    height: 900px;

    transform:
        translate(-50%, -50%);

    background:

        radial-gradient(
            circle at center,
            rgba(255, 0, 240, 0.14) 0%,
            rgba(255, 0, 240, 0.08) 17%,
            rgba(0, 240, 255, 0.11) 30%,
            rgba(0, 240, 255, 0.06) 45%,
            transparent 70%
        );

    filter: blur(8px);

    z-index: -20;

    animation:
        reactorPulse 5s ease-in-out infinite;

    pointer-events: none;
}

@keyframes reactorPulse {

    0%,
    100% {
        opacity: 0.65;

        transform:
            translate(-50%, -50%)
            scale(0.92);
    }

    50% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.08);
    }
}

/* =========================================================
   GRILLE 3D
   ========================================================= */

.hero .hero-grid {

    position: absolute;

    left: -55%;
    bottom: -31%;

    width: 210%;
    height: 82%;

    background-image:

        linear-gradient(
            rgba(0, 240, 255, 0.34) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0, 240, 255, 0.34) 1px,
            transparent 1px
        );

    background-size:
        50px 50px,
        50px 50px;

    transform:
        perspective(600px)
        rotateX(67deg);

    transform-origin:
        center bottom;

    opacity: 0.75;

    z-index: -12;

    mask-image:
        linear-gradient(
            to top,
            black 0%,
            black 35%,
            rgba(0,0,0,0.75) 55%,
            transparent 100%
        );

    -webkit-mask-image:
        linear-gradient(
            to top,
            black 0%,
            black 35%,
            rgba(0,0,0,0.75) 55%,
            transparent 100%
        );

    animation:
        gridTravel 10s linear infinite;

    pointer-events: none;
}

@keyframes gridTravel {

    from {
        background-position:
            0 0,
            0 0;
    }

    to {
        background-position:
            0 50px,
            50px 0;
    }
}

/* =========================================================
   GRILLE VERTICALE / ESPACE DERRIÈRE LE HERO
   ========================================================= */

.hero .space-grid {

    position: absolute;

    inset: 0;

    background-image:

        linear-gradient(
            90deg,
            transparent 49.7%,
            rgba(0,240,255,0.04) 50%,
            transparent 50.3%
        ),

        linear-gradient(
            0deg,
            transparent 49.7%,
            rgba(0,240,255,0.035) 50%,
            transparent 50.3%
        );

    background-size:
        140px 140px,
        140px 140px;

    opacity: 0.45;

    z-index: -18;

    transform:
        perspective(1000px)
        rotateX(8deg)
        scale(1.15);

    pointer-events: none;
}

/* =========================================================
   ANNEAUX HOLOGRAPHIQUES
   ========================================================= */

.hero .holo-ring {

    position: absolute;

    left: 50%;
    top: 48%;

    width: 560px;
    height: 560px;

    transform:
        translate(-50%, -50%)
        rotateX(70deg);

    border-radius: 50%;

    border:
        1px solid rgba(0, 240, 255, 0.48);

    box-shadow:

        0 0 10px rgba(0,240,255,0.25),

        inset 0 0 20px rgba(0,240,255,0.12);

    z-index: -10;

    pointer-events: none;

    animation:
        ringRotation 18s linear infinite;
}

.hero .holo-ring::before {

    content: "";

    position: absolute;

    inset: 45px;

    border-radius: 50%;

    border:
        1px dashed rgba(255, 0, 240, 0.65);

    box-shadow:
        0 0 20px rgba(255,0,240,0.18);
}

.hero .holo-ring::after {

    content: "";

    position: absolute;

    inset: 110px;

    border-radius: 50%;

    border:
        1px solid rgba(0,240,255,0.55);

    box-shadow:
        0 0 15px rgba(0,240,255,0.25);
}

@keyframes ringRotation {

    from {
        transform:
            translate(-50%, -50%)
            rotateX(70deg)
            rotateZ(0deg);
    }

    to {
        transform:
            translate(-50%, -50%)
            rotateX(70deg)
            rotateZ(360deg);
    }
}

/* =========================================================
   CIRCUITS NÉON
   ========================================================= */

.hero .circuit {

    position: absolute;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--neon-cyan),
            transparent
        );

    box-shadow:
        0 0 6px var(--neon-cyan),
        0 0 15px rgba(0,240,255,0.55);

    z-index: -5;

    pointer-events: none;

    opacity: 0.85;
}

.hero .circuit::before {

    content: "";

    position: absolute;

    width: 6px;
    height: 6px;

    top: -3px;

    border-radius: 50%;

    background: var(--neon-cyan);

    box-shadow:
        0 0 8px var(--neon-cyan),
        0 0 18px var(--neon-cyan);
}

.hero .circuit::after {

    content: "";

    position: absolute;

    width: 45px;
    height: 45px;

    top: -22px;

    border:
        1px solid rgba(0,240,255,0.35);

    transform: rotate(45deg);

    opacity: 0.7;
}

.circuit-one {

    width: 32%;

    left: -4%;

    top: 28%;

    transform: rotate(13deg);

    animation:
        circuitScanOne 5s linear infinite;
}

.circuit-one::before {
    right: 22%;
}

.circuit-one::after {
    right: 18%;
}

.circuit-two {

    width: 30%;

    right: -4%;

    top: 34%;

    transform: rotate(-13deg);

    animation:
        circuitScanTwo 6s linear infinite;
}

.circuit-two::before {
    left: 24%;
}

.circuit-two::after {
    left: 18%;
}

.circuit-three {

    width: 38%;

    left: -5%;

    bottom: 27%;

    transform: rotate(-9deg);

    animation:
        circuitScanOne 7s linear infinite reverse;
}

.circuit-three::before {
    right: 30%;
}

.circuit-four {

    width: 35%;

    right: -5%;

    bottom: 24%;

    transform: rotate(9deg);

    animation:
        circuitScanTwo 7s linear infinite reverse;
}

.circuit-four::before {
    left: 27%;
}

@keyframes circuitScanOne {

    0%,
    100% {
        opacity: 0.35;
        filter: brightness(0.8);
    }

    50% {
        opacity: 1;
        filter: brightness(1.8);
    }
}

@keyframes circuitScanTwo {

    0%,
    100% {
        opacity: 0.45;
        filter: brightness(0.9);
    }

    50% {
        opacity: 1;
        filter: brightness(1.7);
    }
}

/* =========================================================
   BARRE DE SCAN SUR TOUT L'ÉCRAN
   ========================================================= */

.hero .scan-line {

    position: absolute;

    left: 0;

    width: 100%;
    height: 2px;

    background:

        linear-gradient(
            90deg,
            transparent 0%,
            rgba(0,240,255,0.1) 10%,
            var(--neon-cyan) 35%,
            white 50%,
            var(--neon-pink) 65%,
            rgba(255,0,240,0.1) 90%,
            transparent 100%
        );

    box-shadow:
        0 0 7px var(--neon-cyan),
        0 0 15px var(--neon-pink);

    z-index: 15;

    pointer-events: none;

    animation:
        globalScan 5.5s linear infinite;
}

@keyframes globalScan {

    0% {
        top: -5%;
        opacity: 0;
    }

    8% {
        opacity: 0.8;
    }

    88% {
        opacity: 0.8;
    }

    100% {
        top: 105%;
        opacity: 0;
    }
}

/* =========================================================
   TITRE
   ========================================================= */

.hero h1 {

    position: relative;

    z-index: 20;

    font-size:
        clamp(34px, 5.3vw, 78px);

    line-height: 1.08;

    font-weight: 900;

    letter-spacing: 3px;

    color: #ffffff;

    transform:
        translateZ(80px);

    text-shadow:

        0 0 4px #ffffff,

        0 0 9px var(--neon-pink),

        0 0 20px var(--neon-pink),

        0 0 40px var(--neon-pink),

        0 0 75px rgba(255,0,240,0.7);

    animation:
        titleGlow 2.4s ease-in-out infinite,
        hologramShake 8s infinite;
}

/* =========================================================
   SCAN LIGNE PAR LIGNE DU TITRE
   ========================================================= */

.hero h1::before {

    content: "";

    position: absolute;

    left: -5%;

    width: 110%;

    height: 2px;

    top: 0;

    background:

        linear-gradient(
            90deg,
            transparent,
            var(--neon-cyan),
            white,
            var(--neon-pink),
            transparent
        );

    box-shadow:
        0 0 8px var(--neon-cyan),
        0 0 15px var(--neon-pink);

    z-index: 5;

    pointer-events: none;

    animation:
        titleScan 4s linear infinite;
}

@keyframes titleScan {

    0% {
        top: 0;
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    90% {
        opacity: 1;
    }

    100% {
        top: 100%;
        opacity: 0;
    }
}

@keyframes titleGlow {

    0%,
    100% {

        text-shadow:

            0 0 4px #ffffff,
            0 0 9px var(--neon-pink),
            0 0 20px var(--neon-pink),
            0 0 40px var(--neon-pink),
            0 0 70px rgba(255,0,240,0.6);
    }

    50% {

        text-shadow:

            0 0 7px #ffffff,
            0 0 15px var(--neon-pink),
            0 0 32px var(--neon-pink),
            0 0 60px var(--neon-pink),
            0 0 100px rgba(255,0,240,0.8);
    }
}

@keyframes hologramShake {

    0%,
    90%,
    100% {

        transform:
            translateZ(80px)
            translateX(0);
    }

    91% {

        transform:
            translateZ(80px)
            translateX(-2px);
    }

    92% {

        transform:
            translateZ(80px)
            translateX(2px);
    }

    93% {

        transform:
            translateZ(80px)
            translateX(-1px);
    }

    94% {

        transform:
            translateZ(80px)
            translateX(0);
    }
}

/* =========================================================
   SOUS-TITRE — TEXTE ORIGINAL CONSERVÉ
   ========================================================= */

.hero > p {

    position: relative;

    z-index: 20;

    max-width: 900px;

    margin:
        25px auto
        45px;

    color: #c9dbe4;

    font-size:
        clamp(12px, 1.45vw, 18px);

    line-height: 1.7;

    text-shadow:
        0 0 8px rgba(0,240,255,0.35);

    transform:
        translateZ(45px);
}

/* =========================================================
   PANNEAUX HOLOGRAPHIQUES
   ========================================================= */

.hero-holo-panels {

    position: absolute;

    top: 48%;

    left: 0;

    width: 100%;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding:
        0 3.5%;

    transform:
        translateY(-50%);

    z-index: 18;

    pointer-events: none;
}

.hero-panel {

    position: relative;

    width: 245px;

    min-height: 135px;

    padding: 20px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    background:

        linear-gradient(
            135deg,
            rgba(0,240,255,0.13),
            rgba(0,15,30,0.78)
        );

    border:
        1px solid rgba(0,240,255,0.9);

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

    box-shadow:

        0 0 7px rgba(0,240,255,0.9),

        0 0 25px rgba(0,240,255,0.32),

        inset 0 0 22px rgba(0,240,255,0.10);

    text-align: left;

    transform:
        perspective(900px)
        rotateY(13deg);

    animation:
        holoPanelLeft 4s ease-in-out infinite;
}

.hero-panel:last-child {

    text-align: right;

    transform:
        perspective(900px)
        rotateY(-13deg);

    animation:
        holoPanelRight 4s ease-in-out infinite;
}

/* =========================================================
   PANNEAUX — LIGNES DE CADRAGE
   ========================================================= */

.hero-panel::before {

    content: "";

    position: absolute;

    top: -1px;
    left: 12%;

    width: 76%;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--neon-cyan),
            white,
            var(--neon-cyan),
            transparent
        );

    box-shadow:
        0 0 8px var(--neon-cyan),
        0 0 16px var(--neon-cyan);

    animation:
        panelScan 3s linear infinite;
}

.hero-panel::after {

    content: "";

    position: absolute;

    bottom: -1px;
    right: -1px;

    width: 28px;
    height: 28px;

    border-right:
        2px solid var(--neon-cyan);

    border-bottom:
        2px solid var(--neon-cyan);

    box-shadow:
        4px 4px 12px rgba(0,240,255,0.3);
}

@keyframes panelScan {

    0% {
        transform:
            translateX(-50px);

        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    80% {
        opacity: 1;
    }

    100% {
        transform:
            translateX(50px);

        opacity: 0;
    }
}

@keyframes holoPanelLeft {

    0%,
    100% {

        transform:
            perspective(900px)
            rotateY(13deg)
            translateY(0);
    }

    50% {

        transform:
            perspective(900px)
            rotateY(13deg)
            translateY(-9px);
    }
}

@keyframes holoPanelRight {

    0%,
    100% {

        transform:
            perspective(900px)
            rotateY(-13deg)
            translateY(0);
    }

    50% {

        transform:
            perspective(900px)
            rotateY(-13deg)
            translateY(-9px);
    }
}

.panel-label {

    color:
        var(--neon-cyan);

    font-size:
        10px;

    letter-spacing:
        2px;

    margin-bottom:
        13px;

    text-shadow:
        0 0 8px var(--neon-cyan);
}

.panel-value {

    color:
        #ffffff;

    font-size:
        13px;

    font-weight:
        700;

    line-height:
        1.7;

    text-shadow:
        0 0 7px rgba(255,255,255,0.55);
}

.panel-dot {

    display:
        inline-block;

    width:
        8px;

    height:
        8px;

    margin-right:
        7px;

    border-radius:
        50%;

    background:
        #00ff66;

    box-shadow:
        0 0 7px #00ff66,
        0 0 18px #00ff66;

    animation:
        statusPulse 1.4s infinite;
}

@keyframes statusPulse {

    50% {
        opacity:
            0.35;
    }
}

/* =========================================================
   BRUIT / SCAN HOLOGRAPHIQUE
   ========================================================= */

.hero .hero-noise {

    position: absolute;

    inset: 0;

    z-index: 25;

    pointer-events: none;

    opacity: 0.055;

    background:

        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.45) 0px,
            rgba(255,255,255,0.45) 1px,
            transparent 1px,
            transparent 4px
        );

    animation:
        noiseShift 0.35s steps(2) infinite;
}

@keyframes noiseShift {

    0% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(1px);
    }

    100% {
        transform:
            translateY(-1px);
    }
}

/* =========================================================
   MODULES — CONSERVÉS
   ========================================================= */

.grid-lab {

    display:
        grid;

    grid-template-columns:
        repeat(auto-fit, minmax(320px, 1fr));

    gap:
        30px;

    padding:
        50px 5%;

    position:
        relative;

    z-index:
        30;
}

.module {

    background:
        var(--panel);

    border:
        1px solid var(--neon-cyan);

    border-radius:
        15px;

    padding:
        30px;

    box-shadow:
        0 0 25px rgba(0,240,255,0.15);

    transition:
        0.4s;

    backdrop-filter:
        blur(8px);

    -webkit-backdrop-filter:
        blur(8px);
}

.module:hover {

    transform:
        translateY(-15px)
        rotateX(5deg);

    box-shadow:
        0 0 50px var(--neon-cyan);
}

.module h3 {

    color:
        var(--neon-cyan);

    font-size:
        22px;

    margin-bottom:
        15px;
}

.module p {

    color:
        #ccc;

    margin-bottom:
        20px;

    min-height:
        60px;
}

.btn-module {

    background:
        transparent;

    border:
        1px solid var(--neon-pink);

    color:
        var(--neon-pink);

    padding:
        12px;

    width:
        100%;

    cursor:
        pointer;

    font-weight:
        bold;
}

.btn-module:hover {

    background:
        var(--neon-pink);

    color:
        var(--bg);

    box-shadow:
        0 0 20px var(--neon-pink);
}

/* =========================================================
   NOTIFICATION — CONSERVÉE
   ========================================================= */

.notif {

    position:
        fixed;

    top:
        90px;

    right:
        20px;

    background:
        var(--neon-pink);

    color:
        var(--bg);

    padding:
        15px;

    border-radius:
        8px;

    display:
        none;

    z-index:
        999;

    box-shadow:
        0 0 20px var(--neon-pink);
}

/* =========================================================
   TABLETTE
   ========================================================= */

@media (max-width: 1000px) {

    .hero {

        min-height:
            780px;

        height:
            auto;

        padding:
            160px 25px 100px;
    }

    .hero-holo-panels {

        padding:
            0 1.5%;
    }

    .hero-panel {

        width:
            205px;

        min-height:
            120px;
    }

    .hero h1 {

        font-size:
            clamp(32px, 7vw, 58px);
    }
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    header {

        padding:
            13px 10px;
    }

    .logo {

        font-size:
            12px;
    }

    .followers {

        display:
            none;
    }

    .nav-btns button {

        font-size:
            8px;

        padding:
            6px 7px;

        margin-left:
            3px;
    }

    .hero {

        min-height:
            730px;

        height:
            auto;

        padding:
            125px 12px 70px;

        justify-content:
            center;
    }

    .hero::before {

        width:
            550px;

        height:
            550px;
    }

    .hero h1 {

        font-size:
            clamp(27px, 9vw, 43px);

        letter-spacing:
            1px;

        line-height:
            1.14;

        transform:
            translateZ(30px);
    }

    .hero > p {

        font-size:
            10px;

        line-height:
            1.7;

        margin:
            18px auto 25px;

        max-width:
            95%;
    }

    .hero .hero-grid {

        left:
            -70%;

        width:
            240%;

        bottom:
            -22%;

        height:
            62%;

        background-size:
            35px 35px,
            35px 35px;

        opacity:
            0.65;
    }

    .hero .holo-ring {

        width:
            330px;

        height:
            330px;

        top:
            50%;
    }

    .hero-holo-panels {

        position:
            relative;

        top:
            auto;

        left:
            auto;

        transform:
            none;

        width:
            100%;

        display:
            grid;

        grid-template-columns:
            1fr;

        gap:
            8px;

        padding:
            0;

        margin-top:
            12px;

        order:
            5;
