<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DeepRDMMakademy // BIENVENUE DANS LE FUTUR</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap');

        :root {
            --bg: #000011;
            --neon-cyan: #00F0FF;
            --neon-pink: #FF00F0;
            --cyan-soft: rgba(0, 240, 255, 0.35);
            --pink-soft: rgba(255, 0, 240, 0.35);
            --panel: rgba(0, 15, 30, 0.72);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
        }

        html {
            background: var(--bg);
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: white;
            overflow-x: hidden;
        }

        /* =====================================================
           PARTICULES
        ===================================================== */

        #particles-js {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000011;
            z-index: -50;
            pointer-events: none;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        header {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 20px 5%;

            background: rgba(0, 0, 0, 0.58);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border-bottom: 1px solid var(--neon-cyan);

            box-shadow:
                0 0 15px rgba(0, 240, 255, 0.15);

            z-index: 100;
        }

        .logo {
            font-size: 24px;
            color: var(--neon-cyan);

            text-shadow:
                0 0 8px var(--neon-cyan),
                0 0 18px var(--neon-cyan);
        }

        .nav-btns {
            display: flex;
            align-items: center;
        }

        .nav-btns button {
            background: transparent;

            border: 1px solid var(--neon-pink);

            color: var(--neon-pink);

            padding: 8px 15px;

            margin-left: 10px;

            cursor: pointer;

            transition: 0.3s;
        }

        .nav-btns button:hover {
            background: var(--neon-pink);

            color: var(--bg);

            box-shadow:
                0 0 10px var(--neon-pink),
                0 0 25px var(--neon-pink);
        }

        .followers {
            color: var(--neon-cyan);

            margin-right: 20px;

            text-shadow:
                0 0 8px var(--neon-cyan);
        }

        /* =====================================================
           HERO
        ===================================================== */

        .hero {
            position: relative;

            width: 100%;
            min-height: 820px;
            height: 100vh;

            padding: 170px 5% 100px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            overflow: hidden;

            isolation: isolate;

            perspective: 1400px;
        }

        /* Halo central */

        .hero::before {
            content: "";

            position: absolute;

            left: 50%;
            top: 46%;

            width: 900px;
            height: 900px;

            transform:
                translate(-50%, -50%);

            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 0, 240, 0.14) 0%,
                    rgba(255, 0, 240, 0.08) 17%,
                    rgba(0, 240, 255, 0.11) 30%,
                    rgba(0, 240, 255, 0.06) 45%,
                    transparent 70%
                );

            filter: blur(8px);

            z-index: -20;

            animation:
                reactorPulse 5s ease-in-out infinite;

            pointer-events: none;
        }

        @keyframes reactorPulse {

            0%,
            100% {
                opacity: 0.65;

                transform:
                    translate(-50%, -50%)
                    scale(0.92);
            }

            50% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1.08);
            }
        }

        /* =====================================================
           GRILLE 3D
        ===================================================== */

        .hero-grid {
            position: absolute;

            left: -55%;
            bottom: -31%;

            width: 210%;
            height: 82%;

            background-image:

                linear-gradient(
                    rgba(0, 240, 255, 0.34) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(0, 240, 255, 0.34) 1px,
                    transparent 1px
                );

            background-size:
                50px 50px,
                50px 50px;

            transform:
                perspective(600px)
                rotateX(67deg);

            transform-origin:
                center bottom;

            opacity: 0.75;

            z-index: -12;

            mask-image:
                linear-gradient(
                    to top,
                    black 0%,
                    black 35%,
                    rgba(0,0,0,0.75) 55%,
                    transparent 100%
                );

            -webkit-mask-image:
                linear-gradient(
                    to top,
                    black 0%,
                    black 35%,
                    rgba(0,0,0,0.75) 55%,
                    transparent 100%
                );

            animation:
                gridTravel 10s linear infinite;

            pointer-events: none;
        }

        @keyframes gridTravel {

            from {
                background-position:
                    0 0,
                    0 0;
            }

            to {
                background-position:
                    0 50px,
                    50px 0;
            }
        }

        /* =====================================================
           GRILLE ESPACE
        ===================================================== */

        .space-grid {
            position: absolute;

            inset: 0;

            background-image:

                linear-gradient(
                    90deg,
                    transparent 49.7%,
                    rgba(0,240,255,0.04) 50%,
                    transparent 50.3%
                ),

                linear-gradient(
                    0deg,
                    transparent 49.7%,
                    rgba(0,240,255,0.035) 50%,
                    transparent 50.3%
                );

            background-size:
                140px 140px,
                140px 140px;

            opacity: 0.45;

            z-index: -18;

            transform:
                perspective(1000px)
                rotateX(8deg)
                scale(1.15);

            pointer-events: none;
        }

        /* =====================================================
           ANNEAU HOLOGRAPHIQUE
        ===================================================== */

        .holo-ring {
            position: absolute;

            left: 50%;
            top: 48%;

            width: 560px;
            height: 560px;

            transform:
                translate(-50%, -50%)
                rotateX(70deg);

            border-radius: 50%;

            border:
                1px solid rgba(0, 240, 255, 0.48);

            box-shadow:
                0 0 10px rgba(0,240,255,0.25),
                inset 0 0 20px rgba(0,240,255,0.12);

            z-index: -10;

            pointer-events: none;

            animation:
                ringRotation 18s linear infinite;
        }

        .holo-ring::before {
            content: "";

            position: absolute;

            inset: 45px;

            border-radius: 50%;

            border:
                1px dashed rgba(255, 0, 240, 0.65);

            box-shadow:
                0 0 20px rgba(255,0,240,0.18);
        }

            inset: 110px;

            border:
