<section class="lab-hero">
  <div class="hero-label"> DEEPRDMMAKADEMY // RESEARCH SYSTEM </div>
  <h2> ENTER THE <span> DIGITAL LAB </span> </h2>
  <p class="hero-description"> Un environnement numérique dédié à la recherche, l'expérimentation, la simulation et l'analyse scientifique de DeepRDMMakademy. </p>
</section>

<!-- ZONE 3D -->
<section class="visualization-area" id="visualizationArea">
  <div class="visualization-label"> RDMM // SCIENTIFIC VISUALIZATION </div>
  <div class="visualization-status" id="datetime"> ● SYSTEM READY </div>
</section>

<style>
 .visualization-area {
    position: relative;
    width: 100%;
    height: 90vh;
    background: #000;
    overflow: hidden;
  }
 .visualization-status {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #00aaff;
    background: rgba(0,0,0,0.7);
    padding: 10px 15px;
    border-radius: 8px;
    font-family: 'Arial', monospace;
    font-size: 13px;
    z-index: 10;
    border: 1px solid rgba(0,170,255,0.3);
  }
</style>

<!-- DEEPRDMM DIGITAL LAB 3D SCIENTIFIC VISUALIZATION -->
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";

// 1. SCENE DANS TA DIV
const container = document.getElementById('visualizationArea');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 5000);
camera.position.set(0, 100, 200);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement); // <- important: on met le canvas DANS ta section

// 2. CONTROLES
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 80;
controls.maxDistance = 400;

// 3. ETOILES
const starGeometry = new THREE.BufferGeometry();
const starCount = 15000;
const starPositions = new Float32Array(starCount * 3);
for(let i = 0; i < starCount * 3; i += 3) {
  starPositions[i] = (Math.random() - 0.5) * 4000;
  starPositions[i+1] = (Math.random() - 0.5) * 4000;
  starPositions[i+2] = (Math.random() - 0.5) * 4000;
}
starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
scene.add(new THREE.Points(starGeometry, new THREE.PointsMaterial({color: 0xffffff, size: 1.2})));

// 4. SOLEIL BLANC
const sunGroup = new THREE.Group();
scene.add(sunGroup);
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(18, 64, 64),
  new THREE.MeshBasicMaterial({ color: 0xffffff }) // BLANC
);
sunGroup.add(sun);
const sunLight = new THREE.PointLight(0xffffff, 4, 2000);
sunGroup.add(sunLight);

// 5. TERRE
const earthGroup = new THREE.Group();
scene.add(earthGroup);
const textureLoader = new THREE.TextureLoader();
const earth = new THREE.Mesh(
  new THREE.SphereGeometry(12, 64, 64),
  new THREE.MeshPhongMaterial({
    map: textureLoader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg')
  })
);
earthGroup.add(earth);
const clouds = new THREE.Mesh(
  new THREE.SphereGeometry(12.15, 64, 64),
  new THREE.MeshPhongMaterial({
    map: textureLoader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png'),
    transparent: true, opacity: 0.35
  })
);
earthGroup.add(clouds);

// 6. SATELLITE
const satellite = new THREE.Mesh(
  new THREE.SphereGeometry(1.2, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9 })
);
scene.add(satellite);

// 7. ANIMATION
let time = 0;
function animate() {
  requestAnimationFrame(animate);
  time += 0.01;
  const daySpeed = 0.02;
  const yearSpeed = 0.0015;

  earth.rotation.y += daySpeed;
  clouds.rotation.y += daySpeed * 1.08;

  earthGroup.position.x = Math.cos(time * yearSpeed) * 120;
  earthGroup.position.z = Math.sin(time * yearSpeed) * 120;

  sun.rotation.y += daySpeed * 0.4;
  sunGroup.position.x = -earthGroup.position.x * 0.25;
  sunGroup.position.z = -earthGroup.position.z * 0.25;

  const satAngle = time * daySpeed * 6;
  satellite.position.x = earthGroup.position.x + Math.cos(satAngle) * 16;
  satellite.position.y = earthGroup.position.y + Math.sin(satAngle * 0.6) * 3;
  satellite.position.z = earthGroup.position.z + Math.sin(satAngle) * 16;

  // DATE HEURE
  const now = new Date();
  document.getElementById('datetime').innerText =
    '● ' + now.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) +
    ' + now.toLocaleTimeString('fr-FR');

  controls.update();
  renderer.render(scene, camera);
}
animate();

// 8. RESPONSIVE DANS TA DIV
window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});
</script>
